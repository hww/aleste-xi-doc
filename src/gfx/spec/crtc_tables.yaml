kind: enum
name: crtc_table_sync
title: "Sync Strobe Generation"
width: 4
entries:
  - {value: "0xF", name: "0xF", description: "stb_char_o — one pulse every 16 pixel clocks"}
  - {value: "0x3", name: "0x3", description: "stb_sync1_o — pulse at pixel 4 within a character"}
  - {value: "0xB", name: "0xB", description: "stb_sync2_o — pulse at pixel 12 within a character"}
notes:
  - "Strobe is generated when `pix_x[3:0]` matches the `code` value."
  - "`stb_char_o` — one pulse every 16 pixel clocks."