kind: regmap
name: palette_regmap
title: "Palette Controller Register Map"
width: 8
view: [diagram, table]

registers:
  - offset: 0x00
    name: "Palette Index"
    fields:
      - {name: "INDEX", bits: [7,0], description: "Индекс цвета (0-255)"}
  - offset: 0x01
    name: "Palette Data Low"
    fields:
      - {name: "DATA_LO", bits: [7,0], description: "Младшие 8 бит цвета"}
  - offset: 0x02
    name: "Palette Data High"
    fields:
      - {name: "DATA_HI", bits: [3,0], description: "Старшие 4 бита (только 12-bit)"}
      - {name: "RSV", bits: [7,4], reserved: true}
  - offset: 0x03
    name: "Border Color Low"
    fields:
      - {name: "BORD_LO", bits: [7,0], description: "Младшие 8 бит цвета бордюра"}
  - offset: 0x04
    name: "Border Color High"
    fields:
      - {name: "BORD_HI", bits: [3,0], description: "Старшие 4 бита бордюра"}
      - {name: "RSV", bits: [7,4], reserved: true}
  - offset: 0x05
    name: "Control Register"
    ref: palette_control
  - offset: 0x06
    name: "Palette Modifier"
    fields:
      - {name: "MODIFIER", bits: [7,0], description: "Значение для OR/XOR модификации"}