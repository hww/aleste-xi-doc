kind: regmap
name: crtc_std_regmap
title: "Standard MC6845 Registers (R0–R17)"
width: 8
view: [diagram, table]

registers:
  - offset: 0x00
    name: "R0: H Total"
    fields: [{name: "H_TOTAL", bits: [7,0], description: "Characters per line - 1"}]
  - offset: 0x01
    name: "R1: H Displayed"
    fields: [{name: "H_DISP", bits: [7,0], description: "Visible characters per line"}]
  - offset: 0x02
    name: "R2: H Sync Pos"
    fields: [{name: "H_SYNC_POS", bits: [7,0], description: "Character position of HSYNC start"}]
  - offset: 0x03
    name: "R3: Sync Widths"
    fields:
      - {name: "H_WIDTH", bits: [3,0], description: "Horizontal sync width"}
      - {name: "V_WIDTH", bits: [7,4], description: "Vertical sync width"}
  - offset: 0x04
    name: "R4: V Total"
    fields: [{name: "V_TOTAL", bits: [6,0], description: "Rows per frame - 1"}]
  - offset: 0x05
    name: "R5: V Adjust"
    fields: [{name: "V_ADJ", bits: [4,0], description: "Not implemented (legacy-compatible)"}]
  - offset: 0x06
    name: "R6: V Displayed"
    fields: [{name: "V_DISP", bits: [6,0], description: "Visible rows"}]
  - offset: 0x07
    name: "R7: V Sync Pos"
    fields: [{name: "V_SYNC_POS", bits: [6,0], description: "Row of VSYNC start"}]
  - offset: 0x08
    name: "R8: Interlace/Skew"
    fields:
      - {name: "INTERLACE", bits: [1,0], description: "Interlace mode"}
      - {name: "SKEW", bits: [5,4], description: "Skew 0-3 char delays"}
  - offset: 0x09
    name: "R9: Max Scan Line"
    fields: [{name: "MAX_SCAN", bits: [4,0], description: "Raster rows per character - 1"}]
  - offset: 0x0A
    name: "R10: Cursor Start"
    fields:
      - {name: "C_START", bits: [4,0], description: "Cursor start scanline"}
      - {name: "C_MODE", bits: [6,5], description: "Blink mode"}
  - offset: 0x0B
    name: "R11: Cursor End"
    fields: [{name: "C_END", bits: [4,0], description: "Cursor bottom scanline"}]
  - offset: 0x0C
    name: "R12: Start Addr H"
    fields: [{name: "ADDR_H", bits: [5,0], description: "Bits A15:A10 of start address"}]
  - offset: 0x0D
    name: "R13: Start Addr L"
    fields: [{name: "ADDR_L", bits: [7,0], description: "Bits A9:A2 of start address"}]
  - offset: 0x0E
    name: "R14: Cursor Addr H"
    fields: [{name: "CUR_H", bits: [5,0], description: "High cursor address"}]
  - offset: 0x0F
    name: "R15: Cursor Addr L"
    fields: [{name: "CUR_L", bits: [7,0], description: "Low cursor address"}]
  - offset: 0x10
    name: "R16: Light Pen H"
    fields: [{name: "LP_H", bits: [7,0], description: "Not implemented"}]
  - offset: 0x11
    name: "R17: Light Pen L"
    fields: [{name: "LP_L", bits: [7,0], description: "Not implemented"}]