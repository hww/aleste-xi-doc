# ============================================================
# LX-GPU: Architecture Description
# Instruction format bitfields live in isa.yaml.
# This file describes the register file, channels, flags, FSM, and timing.
# ============================================================

kind: bitfield
name: shadow_bitfield
title: "SHADOW Register Format"
width: 16
fields:
  - {name: V,        bit: 15, description: "Overflow flag"}
  - {name: C,        bit: 14, description: "Carry flag"}
  - {name: N,        bit: 13, description: "Negative flag"}
  - {name: Z,        bit: 12, description: "Zero flag"}
  - {name: RET_ADDR, bits: [11,0], description: "Return address (PC+1)"}
---
kind: enum
name: registers
title: "Register file · R0–R31 (16 bit)"
width: 5
entries:
  - {value: 0,  name: "R0",  description: "General-purpose (NOT hardwired to zero; use ZERO=32 for constant 0)"}
  - {value: 1,  name: "R1",  description: "General-purpose"}
  - {value: 2,  name: "R2",  description: "General-purpose"}
  - {value: 3,  name: "R3",  description: "General-purpose"}
  - {value: 4,  name: "R4",  description: "General-purpose"}
  - {value: 5,  name: "R5",  description: "General-purpose"}
  - {value: 6,  name: "R6",  description: "General-purpose"}
  - {value: 7,  name: "R7",  description: "General-purpose"}
  - {value: 8,  name: "R8",  description: "General-purpose"}
  - {value: 9,  name: "R9",  description: "General-purpose"}
  - {value: 10, name: "R10", description: "General-purpose"}
  - {value: 11, name: "R11", description: "General-purpose"}
  - {value: 12, name: "R12", description: "General-purpose"}
  - {value: 13, name: "R13", description: "General-purpose"}
  - {value: 14, name: "R14", description: "General-purpose"}
  - {value: 15, name: "R15", description: "General-purpose"}
  - {value: 16, name: "R16", description: "General-purpose"}
  - {value: 17, name: "R17", description: "General-purpose"}
  - {value: 18, name: "R18", description: "General-purpose"}
  - {value: 19, name: "R19", description: "General-purpose"}
  - {value: 20, name: "R20", description: "General-purpose"}
  - {value: 21, name: "R21", description: "General-purpose"}
  - {value: 22, name: "R22", description: "General-purpose"}
  - {value: 23, name: "R23", description: "General-purpose"}
  - {value: 24, name: "R24", description: "General-purpose"}
  - {value: 25, name: "R25", description: "General-purpose"}
  - {value: 26, name: "R26", description: "General-purpose"}
  - {value: 27, name: "R27", description: "General-purpose"}
  - {value: 28, name: "R28", description: "General-purpose"}
  - {value: 29, name: "R29", description: "General-purpose"}
  - {value: 30, name: "R30", description: "General-purpose"}
  - {value: 31, name: "R31", description: "General-purpose"}
---
kind: enum
name: sysregs
title: "System Registers (32..38, 39 reserved)"
width: 6
entries:
  - {value: 32, name: "ZERO",     description: "Constant zero"}
  - {value: 33, name: "FLAGS",    description: "Flags V, C, N, Z (see flags_bitfield)"}
  - {value: 34, name: "SHADOW",   description: "CALL/RET return address and flags (see shadow_bitfield)"}
  - {value: 35, name: "LOOP_CNT", description: "Loop counter"}
  - {value: 36, name: "LOOP_TGT", description: "Loop target"}
  - {value: 37, name: "BUSY",     description: "Busy flags (see busy_bitfield)"}
  - {value: 38, name: "MHI",      description: "Upper 16 bits of MUL"}
  - {value: 39, name: "reserved", description: "-"}
---
kind: enum
name: channels
title: "Pixel Engine Channels (48..63)"
width: 6
entries:
  - {value: 48, name: "CH0_IDX",       description: "Pixel index"}
  - {value: 49, name: "CH0_IDXH",      description: "Upper 3 bits of index"}
  - {value: 50, name: "CH0_STEP",      description: "Step (12.4)"}
  - {value: 51, name: "CH0_MODE_PAGE", description: "MODE and PAGE"}
  - {value: 52, name: "CH1_IDX",       description: "Pixel index"}
  - {value: 53, name: "CH1_IDXH",      description: "Upper 3 bits of index"}
  - {value: 54, name: "CH1_STEP",      description: "Step (12.4)"}
  - {value: 55, name: "CH1_MODE_PAGE", description: "MODE and PAGE"}
  - {value: 56, name: "CH2_IDX",       description: "Pixel index"}
  - {value: 57, name: "CH2_IDXH",      description: "Upper 3 bits of index"}
  - {value: 58, name: "CH2_STEP",      description: "Step (12.4)"}
  - {value: 59, name: "CH2_MODE_PAGE", description: "MODE and PAGE"}
  - {value: 60, name: "CH3_IDX",       description: "Pixel index"}
  - {value: 61, name: "CH3_IDXH",      description: "Upper 3 bits of index"}
  - {value: 62, name: "CH3_STEP",      description: "Step (12.4)"}
  - {value: 63, name: "CH3_MODE_PAGE", description: "MODE and PAGE"}
---
kind: enum
name: data_regs
title: "DATA[0..3] (40..43)"
width: 6
entries:
  - {value: 40, name: "DATA0", description: "Pixel engine temporary register"}
  - {value: 41, name: "DATA1", description: "Pixel engine temporary register"}
  - {value: 42, name: "DATA2", description: "Pixel engine temporary register"}
  - {value: 43, name: "DATA3", description: "Pixel engine temporary register"}
---
kind: bitfield
name: channel_mode_page
title: "CHANNEL MODE_PAGE (11 bits: MODE[2:0] + PAGE[7:0])"
width: 11
fields:
  - {name: PAGE, bits: [7,0], description: "Page number (8 bits)"}
  - {name: FMT,  bits: [10,8], description: "Channel format (3 bits)"}
notes:
  - "In RTL, MODE and PAGE are two separate registers: mode_r[ch] (3 bits) and page_ebr[ch] (8 bits). MODE_PAGE is their logical concatenation."
---
kind: bitfield
name: flags_bitfield
title: "FLAGS Register"
width: 4
fields:
  - {name: V, bit: 3, description: "Overflow flag"}
  - {name: C, bit: 2, description: "Carry flag"}
  - {name: N, bit: 1, description: "Negative flag"}
  - {name: Z, bit: 0, description: "Zero flag"}
---
kind: bitfield
name: busy_bitfield
title: "BUSY Register"
width: 4
fields:
  - {name: HIT,         bit: 0, description: "Cache hit"}
  - {name: ACCESS_DONE, bit: 1, description: "Pixel access complete (one-cycle strobe)"}
  - {name: FLUSH_DONE,  bit: 2, description: "Flush complete (one-cycle strobe)"}
  - {name: WB_CYC,      bit: 3, description: "Wishbone cycle active"}
---
kind: enum
name: channel_mode
title: "CHANNEL FORMAT (fmt, 3 bits)"
width: 3
entries:
  - {value: 0, name: "1 bpp",    description: "16 pixels per word (k=4); SOURCE ONLY, writes forbidden"}
  - {value: 1, name: "2 bpp",    description: "8 pixels per word (k=3)"}
  - {value: 2, name: "4 bpp",    description: "4 pixels per word (k=2); pos 0 = high nibble"}
  - {value: 3, name: "8 bpp",    description: "2 pixels per word (k=1); pos 0 = high byte"}
  - {value: 4, name: "16 bpp",   description: "1 pixel per word (k=0)"}
  - {value: 5, name: "PASS_LO8", description: "Low byte pass-through"}
  - {value: 6, name: "PASS_HI8", description: "High byte pass-through"}
  - {value: 7, name: "PASS16",   description: "Whole word pass-through"}
---
kind: enum
name: commands
title: "Loader packet headers"
width: 3
entries:
  - {value: 0, name: "END",  description: "End, IDLE (arg: -)"}
  - {value: 1, name: "ENDI", description: "End with interrupt (arg: IRQ code)"}
  - {value: 2, name: "CODE", description: "Load microcode: start address, then 2 packet words per instruction (arg: word count)"}
  - {value: 3, name: "RUN",  description: "Start microprogram (arg: entry point)"}
  - {value: 4, name: "JUMP", description: "Next 2 words = new stream pointer (arg: -)"}
notes:
  - "Loader is not implemented in RTL. Reserved for future extension."
---
kind: memmap
name: memory_map
title: "Memory Map (24-bit physical address = {PAGE[7:0], WORD[14:0], 1'b0})"
width: 24
regions:
  - {name: "PAGE 0x00",  start: 0x000000, end: 0x01FFFF, access: rw, purpose: "Page 0 (128 KB)"}
  - {name: "...",        start: 0x020000, end: 0xFDFFFF, access: rw, purpose: "Pages 1..254 (each 128 KB)"}
  - {name: "PAGE 0xFF",  start: 0xFE0000, end: 0xFFFFFF, access: rw, purpose: "Page 255 (last 128 KB)"}
notes:
  - "In RTL addr24 = {page[7:0], word[14:0], 1'b0}. Address space is 16 MB, divided into 256 pages of 128 KB each."
---
kind: fsm
name: cache_fsm
title: "Cache FSM"
initial: C_IDLE
states:
  - {name: "C_IDLE",      description: "Waiting for access / prefetch / flush"}
  - {name: "C_FILL_REQ",  description: "Read miss: wb_cyc=1 until wb_ack_i"}
  - {name: "C_WB_REQ",    description: "Writeback of dirty channel: wb_cyc=1 until wb_ack_i"}
transitions:
  - {from: "C_IDLE",     to: "C_FILL_REQ", when: "access && !hit || prefetch_req && !hit"}
  - {from: "C_FILL_REQ", to: "C_IDLE",     when: "wb_ack_i"}
  - {from: "C_IDLE",     to: "C_WB_REQ",   when: "flush_req && valid && dirty"}
  - {from: "C_WB_REQ",   to: "C_IDLE",     when: "wb_ack_i"}
  - {from: "C_IDLE",     to: "C_IDLE",     when: "flush_req && !(valid && dirty)", do: "valid=0, dirty=0, flush_done=1"}
notes:
  - "C_IDLE -> C_IDLE is flush_noop: flush requested but channel invalid or clean, no WB needed."
  - "gc is a 4-channel single-word buffer, not a classic cache. Writing N consecutive words requires FLUSH after each word."
---
kind: timing
name: pixel_read_timing
title: "Pixel Read Timing"
subtitle: "Cache miss -> fill -> blender -> register"
signals:
  - {name: clk, type: clock}
  - {name: pc, states: ["001", "002", "003", "003", "003", "004", "005"]}
  - {name: insn, states: ["70800400", "72800010", "10001400", "10001400", "10001400", "11001400", "12001400"]}
  - {name: gc_access, states: ["0", "0", "1", "1", "1", "0", "1"]}
  - {name: gc_access_done, states: ["0", "0", "0", "0", "1", "0", "0"]}
  - {name: pb_start, states: ["0", "0", "0", "0", "1", "0", "0"]}
  - {name: pb_ack, states: ["0", "0", "0", "0", "0", "0", "1"]}
  - {name: we, states: ["0", "0", "0", "0", "0", "0", "1"]}
---
kind: enum
name: pixel_path_stages
title: "Pixel Path Stages"
width: 3
columns:
  - {key: value, title: "Stage"}
  - {key: name, title: "Signal"}
  - {key: description, title: "Description"}
entries:
  - {value: 1, name: "idx_stored",   description: "19-bit index (15 integer, 4 fractional)"}
  - {value: 2, name: "word_out",     description: "15-bit word (integer part)"}
  - {value: 3, name: "gc_rdata",     description: "16-bit data from cache"}
  - {value: 4, name: "pb_pixel_out", description: "16-bit pixel from blender"}
  - {value: 5, name: "wdata",        description: "Written to destination register"}
---
kind: timing
name: timing_regfile
title: "regfile: write mem[wa] on posedge; combinational read rdata = mem[ra]"
signals:
  - {name: clk,     type: clock}
  - {name: we,      states: ["0", "1", "0", "0", "0"]}
  - {name: wa,      states: ["-", "R5", "-", "-", "-"]}
  - {name: wdata,   states: ["-", "1234", "-", "-", "-"]}
  - {name: mem_R5,  states: ["oldR5", "oldR5", "1234", "1234", "1234"]}
  - {name: ra,      states: ["R5", "R5", "R5", "R5", "R5"]}
  - {name: rdata_a, states: ["oldR5", "oldR5", "1234", "1234", "1234"]}
notes:
  - "q_a/q_b/bypass removed: regfile is on flip-flops, read is combinational."
---
kind: timing
name: timing_alu
title: "alu: combinational compute (0 cyc), MHI registered on MUL (1 cyc)"
signals:
  - {name: clk,  type: clock}
  - {name: op,   states: ["MOV", "MUL", "ADD", "AND", "SUB"]}
  - {name: a,    states: ["0010", "03E8", "0001", "FF00", "1000"]}
  - {name: b,    states: ["0020", "03E8", "0001", "0FF0", "2000"]}
  - {name: res,  states: ["0020", "4240", "0002", "0F00", "F000"]}
  - {name: mhi,  states: ["0000", "000F", "000F", "000F", "000F"]}
  - {name: z,    states: ["0", "0", "0", "0", "0"]}
  - {name: c,    states: ["0", "0", "0", "0", "0"]}
---
kind: timing
name: timing_sequencer
title: "sequencer: PC fetch and next-PC (1 cyc per instruction)"
signals:
  - {name: clk,       type: clock}
  - {name: ack,       states: ["1", "1", "1", "0", "1", "1"]}
  - {name: pc,        states: ["100", "101", "102", "102", "102", "103"]}
  - {name: imm_class, states: ["00", "00", "10", "10", "10", "00"]}
  - {name: reg_op,    states: ["-", "-", "JMP", "JMP", "JMP", "-"]}
  - {name: cond,      states: ["AL", "AL", "AL", "AL", "AL", "AL"]}
  - {name: pc_next,   states: ["101", "102", "200", "200", "200", "103"]}
---
kind: timing
name: timing_microcode_rom
title: "microcode_rom: synchronous read, latched on ack"
signals:
  - {name: clk,  type: clock}
  - {name: ack,  states: ["0", "1", "0", "1", "1", "1", "0", "1"]}
  - {name: addr, states: ["100", "100", "100", "101", "102", "103", "103", "104"]}
  - {name: data, states: ["----", "1000", "1000", "1001", "1002", "1003", "1003", "1004"]}
---
kind: timing
name: timing_gpu_cache
title: "gpu_cache: hit (1 cyc), miss/fill (3+ cyc)"
signals:
  - {name: clk,         type: clock}
  - {name: access,      states: ["0", "1", "1", "0", "0", "1", "1", "0"]}
  - {name: hit,         states: ["-", "1", "0", "0", "0", "0", "1", "1"]}
  - {name: state,       states: ["IDLE", "IDLE", "FILL", "FILL", "IDLE", "IDLE", "IDLE", "IDLE"]}
  - {name: wb_cyc_o,    states: ["0", "0", "1", "1", "0", "0", "0", "0"]}
  - {name: wb_ack_i,    states: ["0", "0", "0", "1", "0", "0", "0", "0"]}
  - {name: access_done, states: ["0", "1", "0", "0", "1", "0", "1", "0"]}
---
kind: timing
name: timing_pixel_blender
title: "pixel_blender: IDLE -> CAPTURE -> FREE -> IDLE (3 cyc)"
signals:
  - {name: clk,        type: clock}
  - {name: start,      states: ["0", "1", "0", "0", "0", "1", "0"]}
  - {name: bstate,     states: ["IDLE", "CAPTURE", "FREE", "IDLE", "IDLE", "CAPTURE", "FREE"]}
  - {name: pixel_out,  states: ["----", "1234", "1234", "1234", "----", "5678", "5678"]}
  - {name: word_out,   states: ["----", "----", "ABCD", "ABCD", "----", "----", "EF01"]}
  - {name: ack,        states: ["0", "0", "1", "0", "0", "0", "1"]}
---
kind: timing
name: timing_alu_pipeline
title: "ALU instruction: combinational read/compute/write within 1 cyc"
signals:
  - {name: clk,     type: clock}
  - {name: insn,    states: ["ADD R5,R7", "-", "-", "-", "-"]}
  - {name: ra,      states: ["R5", "-", "-", "-", "-"]}
  - {name: rb,      states: ["R7", "-", "-", "-", "-"]}
  - {name: mem_R5,  states: ["oldR5", "oldR5", "R5+R7", "R5+R7", "R5+R7"]}
  - {name: mem_R7,  states: ["oldR7", "oldR7", "oldR7", "oldR7", "oldR7"]}
  - {name: rdata_a, states: ["oldR5", "R5", "R5", "R5", "R5"]}
  - {name: rdata_b, states: ["oldR7", "R7", "R7", "R7", "R7"]}
  - {name: alu_res, states: ["oldADD", "R5+R7", "R5+R7", "R5+R7", "R5+R7"]}
  - {name: we,      states: ["0", "1", "0", "0", "0"]}
  - {name: wa,      states: ["-", "R5", "-", "-", "-"]}
  - {name: wdata,   states: ["-", "R5+R7", "-", "-", "-"]}
---
kind: timing
name: timing_top_data
title: "top: DATA read (3 cyc: cache + blender)"
signals:
  - {name: clk,            type: clock}
  - {name: pc,             states: ["100", "100", "100", "100", "101"]}
  - {name: gc_access,      states: ["0", "1", "1", "0", "0"]}
  - {name: gc_access_done, states: ["0", "0", "1", "0", "0"]}
  - {name: pb_start,       states: ["0", "0", "1", "0", "0"]}
  - {name: pb_ack,         states: ["0", "0", "0", "1", "0"]}
  - {name: ack,            states: ["0", "0", "0", "1", "1"]}
---
kind: timing
name: timing_flush
title: "FLUSH: one-cycle en, then C_WB_REQ -> C_IDLE"
signals:
  - {name: clk,         type: clock}
  - {name: pc,          states: ["...", "00A", "00B", "00C", "..."]}
  - {name: insn,        states: ["...", "FLUSH", "MOV", "SUB", "..."]}
  - {name: gc_flush_en, states: ["0", "1", "0", "0", "0"]}
  - {name: gc_flush_ch, states: ["0", "1", "0", "0", "0"]}
  - {name: gc.cstate,   states: ["IDLE", "IDLE", "WB_REQ", "IDLE", "IDLE"]}
  - {name: wb_cyc,      states: ["0", "0", "1", "0", "0"]}
  - {name: wb_we,       states: ["0", "0", "1", "0", "0"]}
  - {name: flush_done,  states: ["0", "0", "0", "1", "0"]}
notes:
  - "flush_en is combinational from insn (is_flush). gc latches it into flush_req on the next posedge, then performs C_WB_REQ and waits for wb_ack. flush_done is a one-cycle strobe."