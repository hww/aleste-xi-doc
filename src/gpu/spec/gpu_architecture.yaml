kind: bitfield
name: channel_mode_page
title: "CHANNEL MODE_PAGE (11 bits, логическая склейка MODE[2:0] + PAGE[7:0])"
width: 11
fields:
  - {name: PAGE, bits: [7,0], description: "Page number (8 bits)"}
  - {name: FMT,  bits: [10,8], description: "Channel format (3 bits)"}
notes:
  - "В RTL MODE и PAGE — два отдельных регистра: mode_r[ch] (3 бита) и page_ebr[ch] (8 бит). MODE_PAGE — это их логическая склейка для удобства записи через один операнд."
