  - {value: 9,  name: "R9",  description: "General-purpose"}
  - {value: 10, name: "R10", description: "General-purpose"}
  - {value: 11, name: "R11", description: "General-purpose"}
  - {value: 12, name: "R12", description: "General-purpose"}
  - {value: 13, name: "R13", description: "General-purpose"}
  - {value: 14, name: "R14", description: "General-purpose"}
  - {value: 15, name: "R15", description: "General-purpose"}
  - {value: 16, name: "R16", description: "General-purpose"}
  - {value: 17, name: "R17", description: "General-purpose"}
  - {value: 18, name: "R18", description: "General-purpose"}
  - {value: 19, name: "R19", description: "General-purpose"}
  - {value: 20, name: "R20", description: "General-purpose"}
  - {value: 21, name: "R21", description: "General-purpose"}
  - {value: 22, name: "R22", description: "General-purpose"}
  - {value: 23, name: "R23", description: "General-purpose"}
  - {value: 24, name: "R24", description: "General-purpose"}
  - {value: 25, name: "R25", description: "General-purpose"}
  - {value: 26, name: "R26", description: "General-purpose"}
  - {value: 27, name: "R27", description: "General-purpose"}
  - {value: 28, name: "R28", description: "General-purpose"}
  - {value: 29, name: "R29", description: "General-purpose"}
