# ============================================================
# LX-GPU: Architecture Description (по RTL combined_code.txt)
# ============================================================

kind: bitfield
name: insn_reg
title: "INSTRUCTION · 32 BIT · J=0 I=0 REG-REG (d = d op s)"
width: 32
fields:
  - {name: L,    bit: 31, description: "Loop flag"}
  - {name: J,    bit: 30, description: "= 0"}
  - {name: I,    bit: 29, description: "= 0"}
  - {name: DST,  bits: [28,24], description: "Destination operand, low 5 bits"}
  - {name: DS,   bit: 23, description: "DST bank: 0 = R0..R31, 1 = special operand"}
  - {name: COND, bits: [22,19], enum: conditions, description: "Condition; false = no register write, no port access"}
  - {name: F,    bit: 18, description: "1 = update flags"}
  - {name: OP,   bits: [17,13], enum: alu_ops, description: "ALU operation"}
  - {name: SRC,  bits: [12,7], enum: operand_map, description: "Second operand {S, n[4:0]}"}
  - {name: RSV,  bits: [6,0], reserved: true, description: "Reserved, must be 0"}
---
kind: bitfield
name: insn_imm12
title: "INSTRUCTION · 32 BIT · J=1 I=1 REG-IMM12 (d = d op imm)"
width: 32
fields:
  - {name: L,    bit: 31, description: "Loop flag"}
  - {name: J,    bit: 30, description: "= 1"}
  - {name: I,    bit: 29, description: "= 1"}
  - {name: DST,  bits: [28,24], description: "Destination operand, low 5 bits"}
  - {name: DS,   bit: 23, description: "DST bank"}
  - {name: COND, bits: [22,19], enum: conditions, description: "Condition"}
  - {name: F,    bit: 18, description: "Update flags"}
  - {name: OP,   bits: [17,13], enum: alu_ops, description: "ALU operation"}
  - {name: SX,   bit: 12, description: "1 = sign-extend IMM, 0 = zero-extend"}
  - {name: IMM,  bits: [11,0], description: "12-bit immediate, operand B"}
---
kind: bitfield
name: insn_ldi24
title: "INSTRUCTION · 32 BIT · J=0 I=1 LDI24 (R[DST] = imm24)"
width: 32
fields:
  - {name: L,     bit: 31, description: "Loop flag"}
  - {name: J,     bit: 30, description: "= 0"}
  - {name: I,     bit: 29, description: "= 1"}
  - {name: DST,   bits: [28,24], description: "R0..R31 only"}
  - {name: IMM24, bits: [23,0], description: "24-bit constant; unconditional, flags untouched"}
---
kind: bitfield
name: insn_ctrl
title: "INSTRUCTION · 32 BIT · J=1 I=0 CONTROL"
width: 32
fields:
  - {name: L,    bit: 31, description: "Loop flag"}
  - {name: J,    bit: 30, description: "= 1"}
  - {name: I,    bit: 29, description: "= 0"}
  - {name: DST,  bits: [28,24], description: "Unused"}
  - {name: DS,   bit: 23, description: "Unused"}
  - {name: COND, bits: [22,19], enum: conditions, description: "Condition"}
  - {name: F,    bit: 18, description: "Unused"}
  - {name: OP,   bits: [17,13], enum: ctrl_ops, description: "Control operation"}
  - {name: REG,  bits: [12,7], overlay: true, description: "Operand for JMPR (any operand, including special)"}
  - {name: ADDR, bits: [11,0], description: "Target address (JMP/CALL), halt code (HALT), IRQ code (IRQ)"}
