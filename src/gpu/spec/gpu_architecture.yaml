---
kind: enum
name: sysregs
title: "System Registers (32..38, 39 reserved)"
width: 6
entries:
  - {value: 32, name: "ZERO",     description: "Constant zero"}
  - {value: 33, name: "FLAGS",    description: "Flags V, C, N, Z (see flags_bitfield)"}
  - {value: 34, name: "SHADOW",   description: "CALL/RET return address and flags (see shadow_bitfield)"}
  - {value: 35, name: "LOOP_CNT", description: "Loop counter"}
  - {value: 36, name: "LOOP_TGT", description: "Loop target"}
  - {value: 37, name: "BUSY",     description: "Busy flags (see busy_bitfield)"}
  - {value: 38, name: "MHI",      description: "Upper 16 bits of MUL"}
  - {value: 39, name: "reserved", description: "-"}
---
kind: enum
name: channels
title: "Pixel Engine Channels (48..63)"
width: 6
entries:
  - {value: 48, name: "CH0_IDX",       description: "Pixel index"}
  - {value: 52, name: "CH1_IDX",       description: "Pixel index"}
  - {value: 56, name: "CH2_IDX",       description: "Pixel index"}
  - {value: 60, name: "CH3_IDX",       description: "Pixel index"}
  - {value: 49, name: "CH0_IDXH",      description: "Upper 3 bits of index"}
  - {value: 53, name: "CH1_IDXH",      description: "Upper 3 bits of index"}
  - {value: 57, name: "CH2_IDXH",      description: "Upper 3 bits of index"}
  - {value: 61, name: "CH3_IDXH",      description: "Upper 3 bits of index"}
  - {value: 50, name: "CH0_STEP",      description: "Step (12.4)"}
  - {value: 54, name: "CH1_STEP",      description: "Step (12.4)"}
  - {value: 58, name: "CH2_STEP",      description: "Step (12.4)"}
  - {value: 62, name: "CH3_STEP",      description: "Step (12.4)"}
  - {value: 51, name: "CH0_MODE_PAGE", description: "MODE and PAGE"}
  - {value: 55, name: "CH1_MODE_PAGE", description: "MODE and PAGE"}
  - {value: 59, name: "CH2_MODE_PAGE", description: "MODE and PAGE"}
  - {value: 63, name: "CH3_MODE_PAGE", description: "MODE and PAGE"}
---
kind: enum
name: data_regs
title: "DATA[0..3] (40..43)"
width: 6
entries:
  - {value: 40, name: "DATA0", description: "Pixel engine temporary register"}
  - {value: 41, name: "DATA1", description: "Pixel engine temporary register"}
  - {value: 42, name: "DATA2", description: "Pixel engine temporary register"}
  - {value: 43, name: "DATA3", description: "Pixel engine temporary register"}
---
kind: bitfield
name: channel_mode_page
title: "CHANNEL MODE_PAGE (11 bits: MODE[2:0] + PAGE[7:0])"
width: 11
fields:
  - {name: PAGE, bits: [7,0], description: "Page number (8 bits)"}
  - {name: FMT,  bits: [10,8], description: "Channel format (3 bits)"}
notes:
  - "In RTL, MODE and PAGE are two separate registers: mode_r[ch] (3 bits) and page_ebr[ch] (8 bits). MODE_PAGE is their logical concatenation."
---
kind: bitfield
name: flags_bitfield
title: "FLAGS Register"
width: 4
fields:
  - {name: V, bit: 3, description: "Overflow flag"}
  - {name: C, bit: 2, description: "Carry flag"}
  - {name: N, bit: 1, description: "Negative flag"}
  - {name: Z, bit: 0, description: "Zero flag"}
---
kind: bitfield
name: busy_bitfield
title: "BUSY Register"
width: 4
fields:
  - {name: HIT,         bit: 0, description: "Cache hit"}
  - {name: ACCESS_DONE, bit: 1, description: "Pixel access complete (one-cycle strobe)"}
  - {name: FLUSH_DONE,  bit: 2, description: "Flush complete (one-cycle strobe)"}
  - {name: WB_CYC,      bit: 3, description: "Wishbone cycle active"}
---
kind: enum
name: channel_mode
title: "CHANNEL FORMAT (fmt, 3 bits)"
width: 3
entries:
  - {value: 0, name: "1 bpp",    description: "16 pixels per word (k=4); SOURCE ONLY, writes forbidden"}
  - {value: 1, name: "2 bpp",    description: "8 pixels per word (k=3)"}
  - {value: 2, name: "4 bpp",    description: "4 pixels per word (k=2); pos 0 = high nibble"}
  - {value: 3, name: "8 bpp",    description: "2 pixels per word (k=1); pos 0 = high byte"}
  - {value: 4, name: "16 bpp",   description: "1 pixel per word (k=0)"}

---
kind: memmap
name: memory_map
title: "Memory Map (24-bit physical address = {PAGE[7:0], WORD[14:0], 1'b0})"
width: 24
regions:
  - {name: "PAGE 0x00",  start: 0x000000, end: 0x01FFFF, access: rw, purpose: "Page 0 (128 KB)"}
  - {name: "...",        start: 0x020000, end: 0xFDFFFF, access: rw, purpose: "Pages 1..254 (each 128 KB)"}
  - {name: "PAGE 0xFF",  start: 0xFE0000, end: 0xFFFFFF, access: rw, purpose: "Page 255 (last 128 KB)"}
notes:
  - "In RTL addr24 = {page[7:0], word[14:0], 1'b0}. Address space is 16 MB, divided into 256 pages of 128 KB each."
---
kind: fsm
name: cache_fsm
title: "Cache FSM"
initial: C_IDLE
states:
  - {name: "C_IDLE",      description: "Waiting for access / prefetch / flush"}
  - {name: "C_FILL_REQ",  description: "Read miss: wb_cyc=1 until wb_ack_i"}
  - {name: "C_WB_REQ",    description: "Writeback of dirty channel: wb_cyc=1 until wb_ack_i"}
transitions:
  - {from: "C_IDLE",     to: "C_FILL_REQ", when: "access && !hit || prefetch_req && !hit"}
  - {from: "C_FILL_REQ", to: "C_IDLE",     when: "wb_ack_i"}
  - {from: "C_IDLE",     to: "C_WB_REQ",   when: "flush_req && valid && dirty"}
  - {from: "C_WB_REQ",   to: "C_IDLE",     when: "wb_ack_i"}
  - {from: "C_IDLE",     to: "C_IDLE",     when: "flush_req && !(valid && dirty)", do: "valid=0, dirty=0, flush_done=1"}
notes:
  - "C_IDLE -> C_IDLE is flush_noop: flush requested but channel invalid or clean, no WB needed."
  - "gc is a 4-channel single-word buffer, not a classic cache. Writing N consecutive words requires FLUSH after each word."
---

kind: enum
name: pixel_path_stages
title: "Pixel Path Stages"
width: 3
columns:
  - {key: value, title: "Stage"}
  - {key: name, title: "Signal"}
  - {key: description, title: "Description"}
entries:
  - {value: 1, name: "idx_stored",   description: "19-bit index (15 integer, 4 fractional)"}
  - {value: 2, name: "word_out",     description: "15-bit word (integer part)"}
  - {value: 3, name: "gc_rdata",     description: "16-bit data from cache"}
  - {value: 4, name: "pb_pixel_out", description: "16-bit pixel from blender"}
  - {value: 5, name: "wdata",        description: "Written to destination register"}
---
# 32-bit microinstruction. Four formats selected by (J, I).
# Layout matches RTL: dst_code [28:23], WRITE [22], COND [21:18], F [17],
# OP [16:12], SRC [11:6] (reg-reg) / SX [11] + IMM11 [10:0] (reg-imm11) /
# ADDR [10:0] (ctrl-jmp) / REG [11:6] + RSV [5:0] (ctrl-jmpr).

kind: const
name: limits
title: "Limits"
values:
  - {name: IMM11_BITS, value: 11, description: "Immediate width in reg-imm11"}
  - {name: CTRL_ADDR_BITS, value: 11, description: "Target address width in JMP/CALL (0..2047)"}
---
kind: enum
name: alu_ops
title: "ALU OP (5 bits, class = op[4:3], fn = op[2:1], flag = op[0])"
width: 5
entries:
  - {value: 0,  name: MOV,  description: "cls=00, fn=00, inv=0: d = s"}
  - {value: 1,  name: MVN,  description: "cls=00, fn=00, inv=1: d = ~s"}
  - {value: 2,  name: AND,  description: "cls=00, fn=01, inv=0: d = d & s"}
  - {value: 3,  name: BIC,  description: "cls=00, fn=01, inv=1: d = d & ~s"}
  - {value: 4,  name: OR,   description: "cls=00, fn=10, inv=0: d = d | s"}
  - {value: 5,  name: ORN,  description: "cls=00, fn=10, inv=1: d = d | ~s"}
  - {value: 6,  name: XOR,  description: "cls=00, fn=11, inv=0: d = d ^ s"}
  - {value: 7,  name: XNOR, description: "cls=00, fn=11, inv=1: d = d ^ ~s"}
  - {value: 8,  name: ADD,  description: "cls=01, fn=00, sub=0, cin_sel=0: d = d + s"}
  - {value: 10, name: ADC,  description: "cls=01, fn=01, sub=0, cin_sel=1: d = d + s + C"}
  - {value: 13, name: SUB,  description: "cls=01, fn=10, sub=1, cin_sel=0: d = d - s; C = not borrow"}
  - {value: 15, name: SBC,  description: "cls=01, fn=11, sub=1, cin_sel=1: d = d - s - (1-C)"}
  - {value: 16, name: ROR,  description: "cls=10, fn=00: 16-bit rotate right by s[3:0]"}
  - {value: 18, name: SHR,  description: "cls=10, fn=01: logical shift right"}
  - {value: 20, name: SAR,  description: "cls=10, fn=10: arithmetic shift right"}
  - {value: 24, name: MUL,  description: "cls=11, fn=00: d = (d * s)[15:0] signed; high 16 to MHI"}
notes:
  - "Writing to ZERO discards the result. NOP = MOV ZERO, ZERO."
  - "TST/CMP are encoded in the assembler with WRITE=0; dedicated opcodes 28/30 are equivalent to AND/SUB with WRITE=0."
---
kind: enum
name: conditions
title: "COND (4 bits, ARM-style)"
width: 4
entries:
  - {value: 0,  name: AL, description: "Always"}
  - {value: 1,  name: EQ, description: "Z=1"}
  - {value: 2,  name: NE, description: "Z=0"}
  - {value: 3,  name: CS, description: "C=1 (unsigned >=)"}
  - {value: 4,  name: CC, description: "C=0 (unsigned <)"}
  - {value: 5,  name: MI, description: "N=1"}
  - {value: 6,  name: PL, description: "N=0"}
  - {value: 7,  name: VS, description: "V=1"}
  - {value: 8,  name: VC, description: "V=0"}
  - {value: 9,  name: HI, description: "C=1 and Z=0"}
  - {value: 10, name: LS, description: "C=0 or Z=1"}
  - {value: 11, name: GE, description: "N=V"}
  - {value: 12, name: LT, description: "N!=V"}
  - {value: 13, name: GT, description: "Z=0 and N=V"}
  - {value: 14, name: LE, description: "Z=1 or N!=V"}
  - {value: 15, name: NV, description: "Never (default=false)"}
---
kind: enum
name: ctrl_ops
title: "CTRL OP (J=1, I=0)"
width: 5
entries:
  - {value: 0, name: NOP,   description: "Nothing"}
  - {value: 1, name: JMP,   description: "PC = ADDR (11 bits)"}
  - {value: 2, name: CALL,  description: "SHADOW[15:12] = flags, SHADOW[11:0] = PC+1; PC = ADDR"}
  - {value: 3, name: RET,   description: "PC = SHADOW[11:0]; flags not restored"}
  - {value: 4, name: HALT,  description: "ADDR=0 -> IDLE; ADDR!=0 -> ERROR(code)"}
  - {value: 5, name: IRQ,   description: "Raise IRQ, code = ADDR"}
  - {value: 6, name: FLUSH, description: "Flush cache channel ADDR[1:0]"}
  - {value: 7, name: RESERVED, description: "Nothing"}
---
kind: enum
name: operand_map
title: "Operand map (6 bits, 0..63)"
width: 6
radix: dec
columns:
  - {key: value, title: "Code"}
  - {key: name, title: "Name"}
  - {key: read, title: "Read"}
  - {key: write, title: "Write"}
entries:
  - {value: "0..31", name: "R0..R31", read: "16-bit value", write: "16-bit value"}
  - {value: 32, name: "ZERO",     read: "0", write: "Ignored"}
  - {value: 33, name: "FLAGS",    read: "[3:0] = V C N Z", write: "[3:0]"}
  - {value: 34, name: "BUSY",     read: "{wb_cyc, flush_done, access_done, hit}", write: "-"}
  - {value: 35, name: "SHADOW",   read: "[15:12] flags, [11:0] PC+1", write: "[11:0] PC"}
  - {value: 36, name: "LOOP_CNT", read: "Loop counter", write: "Loop counter"}
  - {value: 37, name: "LOOP_TGT", read: "Loop target", write: "Loop target"}
  - {value: 38, name: "ROML",     read: "Lover 16 bits of ROM", write: "Lover 16 bits of ROM"}
  - {value: 39, name: "ROMH",     read: "Upper 16 bits of ROM", write: "Upper 16 bits of ROM, ROMA++"}
  - {value: 40, name: "ROMA",     read: "-", write: "ROM Access address with"}
  - {value: 41, name: "MHI",      read: "Upper 16 bits of MUL", write: "-"}
  - {value: "42..43", name: "reserved",   read: "0", write: "-"}
  - {value: "44..47", name: "DATA[0..3]", read: "pixel_out from channel ch", write: "pixel_in to channel ch, operand[1..0] is channel number"}
  - {value: "48..51", name: "IDX[0..3]",  read: "-", write: "Write-only channel IDX registers, operand[1..0] is channel number"}
  - {value: "52..55", name: "IDXH[0..3]", read: "-", write: "Write-only channel IDXH registers, operand[1..0] is channel number"}  
  - {value: "56..59", name: "STEP[0..3]", read: "-", write: "Write-only channel STEP registers, operand[1..0] is channel number"}
  - {value: "60..63", name: "MODE_PAGE[0..3]", read: "-", write: "Write-only channel PAGE registers, operand[1..0] is channel number"}