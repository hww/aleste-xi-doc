kind: bitfield
name: microinstruction
output: [svg, md] 
title: "MICROINSTRUCTION · 36 BIT"
width: 36
fields:
  - {name: REG_OP,  msb: 35, lsb: 31, description: "Операция передачи данных (5 бит)"}
  - {name: ALU_OP,  msb: 30, lsb: 26, description: "Арифметическая или логическая операция (5 бит)"}
  - {name: CTRL_OP, msb: 25, lsb: 23, description: "Управление потоком (3 бита)"}
  - {name: REG_ADDR, msb: 22, lsb: 18, description: "Resource select (5 бит): регистр (LDR/STR) или канал (PACKER_*/SETPAGE/SETMODE/ADDR)"}
  - {name: MASK,    msb: 17, lsb: 15, description: "Что блокировать при выполнении условия"}
  - {name: COND,    msb: 14, lsb: 12, description: "Условие (Z, NZ, N, NN, C, NC + 2)"}
  - {name: IMM,     msb: 11, lsb: 0,  description: "12-битный аргумент. Семантика зависит от команды: константа (LDI/LDH/LDL), адрес (JMP/CALL/LOOP), код IRQ, код операнда (LDX/STX), код флага (WAIT_FLAG), код ошибки (HALT X)"}