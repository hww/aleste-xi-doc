kind: table
name: commands
title: "Заголовки пакетов загрузчика"
notes:
  - "Загрузчик — полная замена старому протоколу обмена."
  - "Защищённая область BRAM 0–31 занята загрузчиком; запись → FAULT."
  - "Формат: {kind[15:12], arg[11:0]}."
  - "Конец пакета собирается из FLUSH → IRQ n → HALT; END и ENDI — разные типы."
columns:
  - {key: code, label: "kind"}
  - {key: name, label: "Имя", bold: true}
  - {key: arg, label: "arg"}
  - {key: description, label: "Описание"}
rows:
  - {code: 0, name: END,  arg: "—",                  description: "Конец, IDLE"}
  - {code: 1, name: ENDI, arg: "код IRQ",            description: "Конец с прерыванием"}
  - {code: 2, name: CODE, arg: "число микрослов",    description: "Загрузка микрокода; далее адрес и по 3 слова на микрослово"}
  - {code: 3, name: RUN,  arg: "точка входа",        description: "Запуск микропрограммы"}
  - {code: 4, name: JUMP, arg: "—",                  description: "Следующие 2 слова — новый DPTR"}