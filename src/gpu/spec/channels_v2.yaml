# ============================================================
# LX-GPU: Channels v2.1 - banked register file & pixel ALU
# Companion to architecture.yaml. Supersedes the flat 48..63 map.
# ============================================================
---
kind: enum
name: v2_operand_map_top
title: "Operand map (6 bits, 0..63)"
width: 6
radix: dec
columns:
  - {key: value, title: "Code"}
  - {key: name, title: "Name"}
  - {key: read, title: "Read"}
  - {key: write, title: "Write"}
entries:
  - {value: "0..31",  name: "R0..R31",    read: "16-bit value", write: "16-bit value"}
  - {value: 32,       name: "ZERO",       read: "0", write: "Ignored"}
  - {value: 33,       name: "FLAGS",      read: "[3:0] = V C N Z", write: "[3:0]"}
  - {value: 34,       name: "BUSY",       read: "{wb_cyc, flush_done, access_done, hit}", write: "-"}
  - {value: 35,       name: "SHADOW",     read: "[15:12] flags, [11:0] PC+1", write: "[11:0] PC"}
  - {value: 36,       name: "LOOP_CNT",   read: "Loop counter", write: "Loop counter"}
  - {value: 37,       name: "LOOP_TGT",   read: "Loop target", write: "Loop target"}
  - {value: 38,       name: "ROML",       read: "Lower 16 bits of ROM word", write: "Lower 16 bits of ROM word"}
  - {value: 39,       name: "ROMH",       read: "Upper 16 bits of ROM word (ROMA++)", write: "Upper 16 bits of ROM word, commit, ROMA++"}
  - {value: 40,       name: "ROMA",       read: "-", write: "ROM access address"}
  - {value: 41,       name: "MHI",        read: "Upper 16 bits of MUL", write: "-"}
  - {value: 42,       name: "BANK",       read: "[2:0] active bank", write: "[2:0] bank select (global, all channels)"}
  - {value: 43,       name: "SPARE",      read: "0", write: "reserved"}
  - {value: "44..47", name: "DATA[0..3]", read: "D: unpacked pixel (KEY if clipped); then pos += step", write: "A: pixel in, starts pixel operation; then pos += step; operand[1..0] = channel"}
  - {value: "48..63", name: "BANK_WINDOW", read: "-", write: "write-only banked register; group = dst[3:2], channel = dst[1:0], bank = BANK"}
notes:
  - "BANK write takes effect on the next instruction (X-stage decode, in-order, no hold)."
  - "Banks 5..7 are reserved: writes to the window are ignored, no error."
  - "RTL reference: 38 ROML, 39 ROMH, 40 ROMA, 41 MHI, 44..47 DATA (top.sv)."
---
kind: enum
name: v2_operand_map_bank_0_pos
title: "Bank 0 POS - position (per scanline). 16.16 two's complement integer / unsigned fraction"
width: 6
radix: dec
columns:
  - {key: value, title: "Code"}
  - {key: name, title: "Name"}
  - {key: read, title: "Read"}
  - {key: write, title: "Write"}
entries:
  - {value: "48..51", name: "XI[0..3]", read: "-", write: "X integer part (signed). With PITCH=0: pixel index [15:0] (old IDX)"}
  - {value: "52..55", name: "YI[0..3]", read: "-", write: "Y integer part (signed). With PITCH=0: bits [2:0] = pixel index [18:16] (old IDXH)"}
  - {value: "56..59", name: "XF[0..3]", read: "-", write: "X fractional part"}
  - {value: "60..63", name: "YF[0..3]", read: "-", write: "Y fractional part"}
---
kind: enum
name: v2_operand_map_bank_1_step
title: "Bank 1 STEP - added to position after every DATA access (per primitive)"
width: 6
radix: dec
columns:
  - {key: value, title: "Code"}
  - {key: name, title: "Name"}
  - {key: read, title: "Read"}
  - {key: write, title: "Write"}
entries:
  - {value: "48..51", name: "DXI[0..3]", read: "-", write: "step X integer part (signed)"}
  - {value: "52..55", name: "DYI[0..3]", read: "-", write: "step Y integer part (signed)"}
  - {value: "56..59", name: "DXF[0..3]", read: "-", write: "step X fractional part"}
  - {value: "60..63", name: "DYF[0..3]", read: "-", write: "step Y fractional part"}
notes:
  - "Old STEP (12.4) maps to DXI = STEP >> 4, DXF = (STEP & 15) << 12, DYI = DYF = 0."
---
kind: enum
name: v2_operand_map_bank_2_clip
title: "Bank 2 CLIP - inclusive signed clip rectangle on integer position (per window)"
width: 6
radix: dec
columns:
  - {key: value, title: "Code"}
  - {key: name, title: "Name"}
  - {key: read, title: "Read"}
  - {key: write, title: "Write"}
entries:
  - {value: "48..51", name: "XMIN[0..3]", read: "-", write: "clip X min (inclusive)"}
  - {value: "52..55", name: "YMIN[0..3]", read: "-", write: "clip Y min (inclusive)"}
  - {value: "56..59", name: "XMAX[0..3]", read: "-", write: "clip X max (inclusive)"}
  - {value: "60..63", name: "YMAX[0..3]", read: "-", write: "clip Y max (inclusive)"}
notes:
  - "Active only when MODE.CLIP_ON = 1. Clipped write: no cache access, no overflow error, position still advances. Clipped read returns KEY."
---
kind: enum
name: v2_operand_map_bank_3_pen
title: "Bank 3 PEN - pen & ALU (per primitive)"
width: 6
radix: dec
columns:
  - {key: value, title: "Code"}
  - {key: name, title: "Name"}
  - {key: read, title: "Read"}
  - {key: write, title: "Write"}
entries:
  - {value: "48..51", name: "B[0..3]",       read: "-", write: "pen constant: fill colour / mask for MSK / compare reference (low W bits)"}
  - {value: "52..55", name: "KEY[0..3]",     read: "-", write: "colour key / compare reference (arbitrary, 0 is legal); also the value returned by a clipped read"}
  - {value: "56..59", name: "ALU_CTL[0..3]", read: "-", write: "pixel ALU control (see v2_alu_ctl_bitfield)"}
  - {value: "60..63", name: "RESERVED",      read: "-", write: "reserved"}
---
kind: enum
name: v2_operand_map_bank_4_surf
title: "Bank 4 SURF - surface (per surface)"
width: 6
radix: dec
columns:
  - {key: value, title: "Code"}
  - {key: name, title: "Name"}
  - {key: read, title: "Read"}
  - {key: write, title: "Write"}
entries:
  - {value: "48..51", name: "MODE_PAGE[0..3]", read: "-", write: "channel mode + page (see v2_mode_bitfield)"}
  - {value: "52..55", name: "PITCH[0..3]",     read: "-", write: "surface pitch in pixels. 0 = linear mode: pixel_index = {YI[2:0], XI}. Else pixel_index = YI*PITCH + XI"}
  - {value: "56..59", name: "RESERVED",        read: "-", write: "reserved"}
  - {value: "60..63", name: "RESERVED",        read: "-", write: "reserved"}
---
kind: bitfield
name: v2_mode_bitfield
title: "Channel MODE (per channel; word written via SURF.MODE_PAGE)"
width: 16
fields:
  - {name: PAGE,     bits: [7,0],   description: "page number (8 bits), 64 KB per page"}
  - {name: FMT,      bits: [10,8],  description: "pixel format (see v2_channel_format)"}
  - {name: RSVD,     bit: 11,       description: "reserved (0); was WO. Whether D is read is derived from ALU_CTL"}
  - {name: CLIP_ON,  bit: 12,       description: "clip against the CLIP bank"}
  - {name: SHR_X,    bit: 13,       description: "operand X >> 1 (logical) before the ALU; not applied to B or to REL operands"}
  - {name: SHR_Y,    bit: 14,       description: "operand Y >> 1 (logical) before the ALU; not applied to B or to REL operands"}
  - {name: RSVD2,    bit: 15,       description: "reserved (0)"}
notes:
  - "Reset 0 => FMT=16bpp, PAGE=0, CLIP_ON=0, SHR_X=0, SHR_Y=0."
---
kind: bitfield
name: v2_alu_ctl_bitfield
title: "ALU_CTL (16 bits, PEN bank group 2)"
width: 16
fields:
  - {name: OP,   bits: [3,0],   description: "ALU operation (see v2_pixel_alu_ops)"}
  - {name: SX,   bits: [5,4],   description: "X source: 0=A, 1=B, 2=D, 3=K"}
  - {name: SY,   bits: [7,6],   description: "Y source: 0=A, 1=B, 2=D, 3=K"}
  - {name: CS,   bits: [9,8],   description: "compare pair (first ? second): 0=A?K, 1=D?K, 2=A?D, 3=D?B"}
  - {name: REL,  bits: [12,10], description: "write condition on CS pair, unsigned: 0=always, 1===, 2=!=, 3=<, 4=>=, 5=>, 6=<=, 7=never"}
  - {name: DEN,  bit: 13,       description: "screen-door gating enable"}
  - {name: DPAR, bit: 14,       description: "screen-door parity: write only if (XI^YI)[0] == DPAR (pre-advance integer parts)"}
  - {name: RSVD, bit: 15,       description: "reserved (0)"}
notes:
  - "Reset 0x0000 => OP=PASS, SX=A, REL=always, DEN=0: copy-A default."
  - "NEED_D = (SX==D) | (SY==D) | (REL in 1..6 & CS != 0). If 0 and W=16: one cache access, no RMW."
  - "All operands are unsigned W-bit values (W by FMT: 16/8/4/2/1; LO8/HI8 = 8); datapath 16 bits wide, bits above W forced to 0."
---
kind: enum
name: v2_pixel_alu_ops
title: "Pixel ALU OP (4 bits), W-bit unsigned"
width: 4
entries:
  - {value: 0, name: "PASS",  description: "R = X"}
  - {value: 1, name: "AND",   description: "R = X & Y"}
  - {value: 2, name: "OR",    description: "R = X | Y"}
  - {value: 3, name: "XOR",   description: "R = X ^ Y (NOT = XOR with B = all ones)"}
  - {value: 4, name: "ANDN",  description: "R = X & ~Y"}
  - {value: 5, name: "ADD",   description: "R = (X + Y) mod 2^W"}
  - {value: 6, name: "ADDS",  description: "R = min(X + Y, 2^W - 1)"}
  - {value: 7, name: "SUBS",  description: "R = max(X - Y, 0)"}
  - {value: 8, name: "MSK",   description: "R = (X & B) | (Y & ~B); third operand B from PEN (not shifted by SHR)"}
  - {value: "9..15", name: "RESERVED", description: "SUB (mod 2^W) etc. MIN/MAX come from REL gating, NOT from XOR"}
---
kind: enum
name: v2_channel_format
title: "CHANNEL FORMAT (fmt, 3 bits); W = operand width of the pixel ALU"
width: 3
entries:
  - {value: 0, name: "16 bpp",   description: "W=16, 1 pixel per word (k=0); reset default"}
  - {value: 1, name: "8 bpp",    description: "W=8, 2 pixels per word (k=1); pos 0 = low byte (even address) - PRIMARY"}
  - {value: 2, name: "4 bpp",    description: "W=4, 4 pixels per word (k=2); pos 0 = low nibble"}
  - {value: 3, name: "2 bpp",    description: "W=2, 8 pixels per word (k=3); SOURCE ONLY, writes forbidden"}
  - {value: 4, name: "1 bpp",    description: "W=1, 16 pixels per word (k=4); SOURCE ONLY, writes forbidden"}
  - {value: 7, name: "RESERVED", description: "Reserved, writes forbidden"}
---
kind: memmap
name: v2_memory_map
title: "Memory Map (24-bit physical address = {PAGE[7:0], WORD[14:0], 1'b0}); 64 KB per page"
width: 24
regions:
  - {name: "PAGE 0x00",  start: 0x000000, end: 0x00FFFF, access: rw, purpose: "Page 0 (64 KB)"}
  - {name: "...",        start: 0x010000, end: 0xFEFFFF, access: rw, purpose: "Pages 1..254 (each 64 KB)"}
  - {name: "PAGE 0xFF",  start: 0xFF0000, end: 0xFFFFFF, access: rw, purpose: "Page 255 (last 64 KB)"}
notes:
  - "8 + 15 + 1 = 24 bits: 256 pages x 32768 words x 2 bytes = 16 MB. The previous text (128 KB per page) contradicted the formula."