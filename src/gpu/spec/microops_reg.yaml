kind: table
name: microops_reg
title: "REG_OP · Передача данных"
columns:
  - {key: op, label: "Микрокоманда"}
  - {key: description, label: "Действие"}
  - {key: cycles, label: "Тактов"}
rows:
  - {op: "NOP",     description: "—", cycles: "1"}
  - {op: "PASS",    description: "ACC = OPR", cycles: "1"}
  - {op: "LDR",     description: "OPR = R[n]", cycles: "1"}
  - {op: "STR",     description: "R[n] = ACC", cycles: "1"}
  - {op: "LDD",     description: "OPR = слово из канала DATA (16 бит, без знака), DPTR++", cycles: "1"}
  - {op: "LDDS",    description: "То же, со знаком", cycles: "1"}
  - {op: "LDSP",    description: "OPR = SPIX, SIDX++", cycles: "1"}
  - {op: "LDDP",    description: "OPR = DPIX", cycles: "1"}
  - {op: "STDP",    description: "DPIX = ACC, DIDX++", cycles: "1"}
  - {op: "SETS",    description: "SIDX = ACC", cycles: "1"}
  - {op: "SETD",    description: "DIDX = ACC", cycles: "1"}
  - {op: "SETP",    description: "DPTR = ACC", cycles: "1"}
  - {op: "LDCNT",   description: "Счётчик цикла = ACC", cycles: "1"}
  - {op: "FLUSH?",  description: "Согласовать память (место — TBD на симуляторе)", cycles: "зависит"}