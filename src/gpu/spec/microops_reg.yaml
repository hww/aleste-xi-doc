kind: code_list
name: microops_reg
title: "REG_OP — Стек A/B/C и данные (5 бит, 32 кода)"
fields: [code, name, description, cycles, imm]
entries:
  - {code: 0,  name: "NOP",          description: "—", cycles: 1, imm: "—"}
  - {code: 1,  name: "LDR",          description: "A = R[REG_ADDR]", cycles: 1, imm: "—"}
  - {code: 2,  name: "LDR_PUSH",     description: "push; A = R[REG_ADDR]", cycles: 1, imm: "—"}
  - {code: 3,  name: "STR",          description: "R[REG_ADDR] = A (без снятия)", cycles: 1, imm: "—"}
  - {code: 4,  name: "STR_POP",      description: "R[REG_ADDR] = A; pop", cycles: 1, imm: "—"}
  - {code: 5,  name: "CLR_A",        description: "A = 0", cycles: 1, imm: "—"}
  - {code: 6,  name: "CLR_AB",       description: "A = 0; B = 0", cycles: 1, imm: "—"}
  - {code: 7,  name: "CLR_C",        description: "C = 0", cycles: 1, imm: "—"}
  - {code: 8,  name: "LDD",          description: "A = mem.read16(DPTR); DPTR += 2", cycles: 1, imm: "—"}
  - {code: 9,  name: "LDD_PUSH",     description: "push; LDD", cycles: 1, imm: "—"}
  - {code: 10, name: "LDDS",         description: "A = (int16)mem.read16(DPTR); DPTR += 2", cycles: 1, imm: "—"}
  - {code: 11, name: "LDDS_PUSH",    description: "push; LDDS", cycles: 1, imm: "—"}
  - {code: 12, name: "SETS",         description: "SIDX = A", cycles: 1, imm: "—"}
  - {code: 13, name: "SETD",         description: "DIDX = A", cycles: 1, imm: "—"}
  - {code: 14, name: "SETP",         description: "DPTR = A", cycles: 1, imm: "—"}
  - {code: 15, name: "LDCNT",        description: "loop_cnt_ = A", cycles: 1, imm: "—"}
  - {code: 16, name: "FLUSH",        description: "Сбросить dirty всех каналов", cycles: "зависит", imm: "—"}
  - {code: 17, name: "LDX",          description: "A = device[REG_ADDR]", cycles: 1, imm: "—"}
  - {code: 18, name: "LDX_PUSH",     description: "push; LDX", cycles: 1, imm: "—"}
  - {code: 19, name: "STX",          description: "device[REG_ADDR] = A (без снятия)", cycles: 1, imm: "—"}
  - {code: 20, name: "STX_POP",      description: "STX; pop", cycles: 1, imm: "—"}
  - {code: 21, name: "LDI",          description: "A = sign_extend(IMM)", cycles: 1, imm: "константа[11:0]"}
  - {code: 22, name: "LDI_PUSH",     description: "push; LDI", cycles: 1, imm: "константа[11:0]"}
  - {code: 23, name: "LDH",          description: "A[23:12] = IMM (младшие 12 не трогает)", cycles: 1, imm: "константа[11:0]"}
  - {code: 24, name: "LDL",          description: "A[11:0] = IMM (старшие 12 не трогает)", cycles: 1, imm: "константа[11:0]"}
  - {code: 25, name: "PACKER_RD",    description: "A = пиксель/слово (ADDR_ или DPTR для CH_DATA)", cycles: 1, imm: "—"}
  - {code: 26, name: "PACKER_RD_PUSH", description: "push; PACKER_RD", cycles: 1, imm: "—"}
  - {code: 27, name: "PACKER_WR",    description: "пиксель/слово = A", cycles: 1, imm: "—"}
  - {code: 28, name: "PACKER_WR_POP", description: "PACKER_WR; pop", cycles: 1, imm: "—"}
  - {code: 29, name: "SETMODE",      description: "ch_mode_[REG_ADDR[1:0]].fmt = A[2:0]", cycles: 1, imm: "—"}
  - {code: 30, name: "SETPAGE",      description: "set_page(REG_ADDR[1:0], A)", cycles: "зависит", imm: "—"}
  - {code: 31, name: "ADDR",         description: "ADDR ch=REG_ADDR[1:0]: A=(y<<12)|x → ADDR_ = addr24, pos", cycles: 1, imm: "—"}
  - {code: 32, name: "IRQ",          description: "irq_pending_=1, irq_code_=A[11:0]", cycles: 1, imm: "—"}
notes:
  - "LDR/STR — регистры R0..R31 (REG_ADDR 0..31)."
  - "LDX/STX — устройства (DeviceMap 0..31)."
  - "PACKER_RD/WR — пиксели через ADDR_ (AddrPacker), CH_DATA — через DPTR."
  - "LDH/LDL — сборка 24-битного адреса: LDL (младшие 12), LDH (старшие 12)."