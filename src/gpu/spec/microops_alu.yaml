kind: code_list
name: microops_alu
title: "ALU_OP — Арифметика и логика (5 бит, 32 кода)"
fields: [code, name, description, cycles]
entries:
  - {code: "0..15", name: "LOGIC", description: "16 функций LUT (A op B). AND=8, OR=14, XOR=6, PASS A=12, PASS B=10, NOT A=3, NOT B=5, ZERO=0, ONE=15.", cycles: 1}
  - {code: 16, name: "ADD", description: "A = A + B; Z, N, C", cycles: 1}
  - {code: 17, name: "SUB", description: "A = A - B; Z, N, C", cycles: 1}
  - {code: 18, name: "CMP", description: "SUB без записи в A, только флаги Z, N, C", cycles: 1}
  - {code: 19, name: "SHL", description: "A = A << B[4:0]", cycles: 1}
  - {code: 20, name: "SHR", description: "A = A >> B[4:0] (логический)", cycles: 1}
  - {code: 21, name: "SAR", description: "A = A >> B[4:0] (арифметический)", cycles: 1}
  - {code: "22..31", name: "резерв", description: "—", cycles: "—"}
notes:
  - "Сатурация, MIN/MAX, MUL, COMB — убраны. Блендинг/пропорциональное смешивание — программно (LOGIC + сдвиги + ADD)."