kind: code_list
name: microops_alu
title: "ALU_OP — Арифметика и логика"
fields: [code, name, description, cycles]
entries:
  - {code: 0,  name: "NOP",  description: "ACC не меняется", cycles: 1}
  - {code: 1,  name: "PASS", description: "ACC = OPR", cycles: 1}
  - {code: 2,  name: "ADD",  description: "ACC = ACC + OPR; Z, N, C", cycles: 1}
  - {code: 3,  name: "SUB",  description: "ACC = ACC - OPR; Z, N, C", cycles: 1}
  - {code: 4,  name: "AND",  description: "ACC = ACC & OPR", cycles: 1}
  - {code: 5,  name: "OR",   description: "ACC = ACC | OPR", cycles: 1}
  - {code: 6,  name: "XOR",  description: "ACC = ACC ^ OPR", cycles: 1}
  - {code: 7,  name: "SHL",  description: "ACC = ACC << OPR[4:0]", cycles: 1}
  - {code: 8,  name: "SHR",  description: "ACC = ACC >> OPR[4:0] (логический)", cycles: 1}
  - {code: 9,  name: "SAR",  description: "ACC = ACC >> OPR[4:0] (арифметический)", cycles: 1}
  - {code: 10, name: "MIN",  description: "ACC = min(ACC, OPR) со знаком", cycles: 1}
  - {code: 11, name: "MAX",  description: "ACC = max(ACC, OPR) со знаком", cycles: 1}
  - {code: 12, name: "MUL",  description: "ACC = ACC[11:0] × OPR[11:0]", cycles: 2}
  - {code: 13, name: "ADDS", description: "ACC = saturate(ACC + OPR)", cycles: 1}
  - {code: 14, name: "SUBS", description: "ACC = saturate(ACC - OPR)", cycles: 1}
  - {code: 15, name: "резерв", description: "—", cycles: "—"}