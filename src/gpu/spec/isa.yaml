kind: encoding
name: insn
title: "INSTRUCTION · 32 BIT"
width: 32
common:
  - {name: L,        bit: 31,       description: "Loop flag"}
  - {name: J,        bit: 30,       description: "Format selector, high"}
  - {name: I,        bit: 29,       description: "Format selector, low"}
  - {name: DST_CODE, bits: [22,17], description: "Destination operand (6 bits)"}
variants:
  - name: reg-reg
    title: "REG-REG"
    when: {J: 0, I: 0}
    fields:
      - {name: WRITE, bit: 24,       description: "1 = write result; 0 = do not write, disables only write back"}
      - {name: COND,  bits: [28,25], enum: conditions}
      - {name: F,     bit: 23,       description: "1 = update flags"}
      - {name: ALU_OP,    bits: [16,12], enum: alu_ops}
      - {name: SRC,   bits: [11,6],  enum: operand_map}
      - {name: RSV,   bits: [5,0],   reserved: true}
  - name: reg-imm11
    title: "REG-IMM11"
    when: {J: 1, I: 1}
    fields:
      - {name: WRITE, bit: 24,       description: "1 = write result; 0 = do not write, disables only write back"}
      - {name: COND,  bits: [28,25], enum: conditions}
      - {name: F,     bit: 23,       description: "1 = update flags"}
      - {name: ALUOP, bits: [16,12], enum: alu_ops}
      - {name: SX,    bit: 11,       description: "1 = sign-extend, 0 = zero-extend"}
      - {name: IMM,   bits: [10,0],  description: "11-bit immediate"}
  - name: ldi16
    title: "LDI16"
    when: {J: 0, I: 1}
    fields:
      - {name: WRITE, bit: 24,       description: "Unused for LDI, must be 1"}
      - {name: COND,  bits: [28,25], enum: conditions}
      - {name: F,     bit: 23,       description: "Unused for LDI, must be 0"}
      - {name: RSV,   bit: 16,       reserved: true}
      - {name: IMM16, bits: [15,0],  description: "16-bit constant"}
  - name: control
    title: "CONTROL"
    when: {J: 1, I: 0, R: 0}
    fields:
      - {name: WRITE, bit: 24,       description: "Unused for CTRL, must be 0"}
      - {name: COND,  bits: [28,25], enum: conditions}
      - {name: F,     bit: 23,       description: "Unused for CTRL (must be 0)"}
      - {name: R,     bit: 16,       description: "Jump/Call by register"}
      - {name: CTRL_OP, bits: [15,12], enum: ctrl_ops}
      - {name: ADDR,  bits: [11,0],  description: "Target address (JMP/CALL), halt/IRQ code, channel (FLUSH)"}
  - name: control_rjump
    title: "CONTROL RJUMP"
    when: {J: 1, I: 0, R: 1}
    fields:
      - {name: WRITE, bit: 24,       description: "Unused for CTRL, must be 0"}
      - {name: COND,  bits: [28,25], enum: conditions}
      - {name: F,     bit: 23,       description: "Unused for CTRL (must be 0)"}
      - {name: R,     bit: 16,       description: "Jump/Call 0-by immediate, 1-by src register"}
      - {name: CTRLOP,bits: [15,12], enum: ctrl_ops}
      - {name: SRC,   bits: [11,6],  enum: operand_map}
      - {name: RSV,   bits: [5,0],   reserved: true}
---
kind: bitfield
name: insn_reg
title: "J=0 I=0 REG-REG"
width: 32
fields:
  - {name: L,        bit: 31,       description: "Loop flag"}
  - {name: J,        bit: 30,       description: "= 0"}
  - {name: I,        bit: 29,       description: "= 0"}
  - {name: COND,     bits: [28,25], enum: conditions, description: "Condition"}
  - {name: WRITE,    bit: 24,       description: "1 = write result; 0 = do not write (flags still update if F=1)"}
  - {name: F,        bit: 23,       description: "1 = update flags"}
  - {name: DST_CODE, bits: [22,17], enum: operand_map, description: "Destination operand (6 bits)"}
  - {name: ALU_OP,   bits: [16,12], enum: alu_ops, description: "ALU operation"}
  - {name: SRC,      bits: [11,6],  enum: operand_map, description: "Second operand (6 bits)"}
  - {name: RSV,      bits: [5,0],   reserved: true, description: "Reserved, must be 0"}
---
kind: bitfield
name: insn_imm11
title: "J=1 I=1 REG-IMM11"
width: 32
fields:
  - {name: L,      bit: 31,       description: "Loop flag"}
  - {name: J,      bit: 30,       description: "= 1"}
  - {name: I,      bit: 29,       description: "= 1"}
  - {name: COND,   bits: [28,25], enum: conditions, description: "Condition"}
  - {name: WRITE,  bit: 24,       description: "1 = write result; 0 = do not write"}
  - {name: F,      bit: 23,       description: "Update flags"}
  - {name: DST_CODE, bits: [22,17], enum: operand_map, description: "Destination operand (6 bits)"}
  - {name: ALU_OP, bits: [16,12], enum: alu_ops, description: "ALU operation"}
  - {name: SX,     bit: 11,       description: "1 = sign-extend IMM11, 0 = zero-extend"}
  - {name: IMM,    bits: [10,0],  description: "11-bit immediate, operand B"}
---
kind: bitfield
name: insn_ldi16
title: "J=0 I=1 LDI16"
width: 32
fields:
  - {name: L,      bit: 31,       description: "Loop flag"}
  - {name: J,      bit: 30,       description: "= 0"}
  - {name: I,      bit: 29,       description: "= 1"}
  - {name: COND,   bits: [28,25], enum: conditions, description: "Condition"}
  - {name: WRITE,  bit: 24,       description: "Unused for LDI, must be 1"}
  - {name: F,      bit: 23,       description: "Unused for LDI, must be 0"}
  - {name: DST_CODE, bits: [22,17], enum: operand_map, description: "Destination operand (6 bits)"}
  - {name: RSV,    bit: 16,       reserved: true, description: "Reserved, must be 0"}
  - {name: IMM16,  bits: [15,0],  description: "16-bit constant"}
---
kind: bitfield
name: insn_ctrl_jmp
title: "J=1 I=0 CONTROL (R=0: JMP/CALL/RET/HALT/IRQ/FLUSH)"
width: 32
fields:
  - {name: L,       bit: 31,       description: "Loop flag"}
  - {name: J,       bit: 30,       description: "= 1"}
  - {name: I,       bit: 29,       description: "= 0"}
  - {name: COND,    bits: [28,25], enum: conditions, description: "Condition"}
  - {name: WRITE,   bit: 24,       description: "Unused for CTRL, must be 0"}
  - {name: F,       bit: 23,       description: "Unused for CTRL (must be 0)"}
  - {name: DST_CODE,bits: [22,17], enum: operand_map, description: "Unused for CTRL"}
  - {name: R,       bit: 16,       description: "Jump/Call: 0 = by immediate, 1 = by source register"}
  - {name: CTRL_OP, bits: [15,12], enum: ctrl_ops, description: "Control operation"}
  - {name: ADDR,    bits: [11,0],  description: "Target address (JMP/CALL), halt/IRQ code, channel (FLUSH)"}
---
kind: bitfield
name: insn_ctrl_jmpr
title: "J=1 I=0 CONTROL RJUMP (R=1: JMPR)"
width: 32
fields:
  - {name: L,       bit: 31,       description: "Loop flag"}
  - {name: J,       bit: 30,       description: "= 1"}
  - {name: I,       bit: 29,       description: "= 0"}
  - {name: COND,    bits: [28,25], enum: conditions, description: "Condition"}
  - {name: WRITE,   bit: 24,       description: "Unused for CTRL, must be 0"}
  - {name: F,       bit: 23,       description: "Unused for CTRL (must be 0)"}
  - {name: DST_CODE,bits: [22,17], enum: operand_map, description: "Unused for CTRL"}
  - {name: R,       bit: 16,       description: "= 1 (register jump)"}
  - {name: CTRL_OP, bits: [15,12], enum: ctrl_ops, description: "= JMPR (register indirect jump)"}
  - {name: SRC,     bits: [11,6],  enum: operand_map, description: "Source operand code (0..63)"}
  - {name: RSV,     bits: [5,0],   reserved: true, description: "Unused, must be 0"}