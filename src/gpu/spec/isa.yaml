# 32-bit microinstruction. Four formats selected by (J, I).
# Layout matches RTL: dst_code [28:23], WRITE [22], COND [21:18], F [17],
# OP [16:12], SRC [11:6] (reg-reg) / SX [11] + IMM11 [10:0] (reg-imm11) /
# ADDR [10:0] (ctrl-jmp) / REG [11:6] + RSV [5:0] (ctrl-jmpr).

kind: const
name: limits
title: "Limits"
values:
  - {name: IMM11_BITS, value: 11, description: "Immediate width in reg-imm11"}
  - {name: CTRL_ADDR_BITS, value: 11, description: "Target address width in JMP/CALL (0..2047)"}
---
kind: bitfield
name: insn_reg
title: "J=0 I=0 REG-REG"
width: 32
fields:
  - {name: L,        bit: 31,       description: "Loop flag"}
  - {name: J,        bit: 30,       description: "= 0"}
  - {name: I,        bit: 29,       description: "= 0"}
  - {name: DST_CODE, bits: [28,23], enum: operand_map, description: "Destination operand (6 bits)"}
  - {name: WRITE,    bit: 22,       description: "1 = write result; 0 = do not write (flags still update if F=1)"}
  - {name: COND,     bits: [21,18], enum: conditions, description: "Condition"}
  - {name: F,        bit: 17,       description: "1 = update flags"}
  - {name: OP,       bits: [16,12], enum: alu_ops, description: "ALU operation"}
  - {name: SRC,      bits: [11,6],  enum: operand_map, description: "Second operand (6 bits)"}
  - {name: RSV,      bits: [5,0],   reserved: true, description: "Reserved, must be 0"}
---
kind: bitfield
name: insn_imm11
title: "J=1 I=1 REG-IMM11"
width: 32
fields:
  - {name: L,        bit: 31,       description: "Loop flag"}
  - {name: J,        bit: 30,       description: "= 1"}
  - {name: I,        bit: 29,       description: "= 1"}
  - {name: DST_CODE, bits: [28,23], enum: operand_map, description: "Destination operand (6 bits)"}
  - {name: WRITE,    bit: 22,       description: "1 = write result; 0 = do not write"}
  - {name: COND,     bits: [21,18], enum: conditions, description: "Condition"}
  - {name: F,        bit: 17,       description: "Update flags"}
  - {name: OP,       bits: [16,12], enum: alu_ops, description: "ALU operation"}
  - {name: SX,       bit: 11,       description: "1 = sign-extend IMM11, 0 = zero-extend"}
  - {name: IMM,      bits: [10,0],  description: "11-bit immediate, operand B"}
---
kind: bitfield
name: insn_ctrl_jmp
title: "J=1 I=0 CTRL (JMP/CALL/RET/HALT/IRQ/FLUSH)"
width: 32
fields:
  - {name: L,        bit: 31,       description: "Loop flag"}
  - {name: J,        bit: 30,       description: "= 1"}
  - {name: I,        bit: 29,       description: "= 0"}
  - {name: DST_CODE, bits: [28,23], enum: operand_map, description: "Unused for non-JMPR CTRL"}
  - {name: WRITE,    bit: 22,       description: "Unused for CTRL"}
  - {name: COND,     bits: [21,18], enum: conditions, description: "Condition"}
  - {name: F,        bit: 17,       description: "Unused for CTRL (must be 0)"}
  - {name: OP,       bits: [16,12], enum: ctrl_ops, description: "Control operation"}
  - {name: SX,       bit: 11,       description: "Unused in CTRL"}
  - {name: ADDR,     bits: [10,0],  description: "Target address (JMP/CALL), halt/IRQ code, channel (FLUSH)"}
---
kind: bitfield
name: insn_ctrl_jmpr
title: "J=1 I=0 CTRL (JMPR)"
width: 32
fields:
  - {name: L,        bit: 31,       description: "Loop flag"}
  - {name: J,        bit: 30,       description: "= 1"}
  - {name: I,        bit: 29,       description: "= 0"}
  - {name: DST_CODE, bits: [28,23], enum: operand_map, description: "Source register for target address"}
  - {name: WRITE,    bit: 22,       description: "Unused"}
  - {name: COND,     bits: [21,18], enum: conditions, description: "Condition"}
  - {name: F,        bit: 17,       description: "Unused"}
  - {name: OP,       bits: [16,12], enum: ctrl_ops, description: "= JMPR"}
  - {name: REG,      bits: [11,6],  enum: operand_map, description: "Source operand code (0..63)"}
  - {name: RSV,      bits: [5,0],   reserved: true, description: "Unused"}
---
kind: enum
name: alu_ops
title: "ALU OP (5 bits, class = op[4:3], fn = op[2:1], flag = op[0])"
width: 5
entries:
  - {value: 0,  name: MOV,  description: "cls=00, fn=00, inv=0: d = s"}
  - {value: 1,  name: MVN,  description: "cls=00, fn=00, inv=1: d = ~s"}
  - {value: 2,  name: AND,  description: "cls=00, fn=01, inv=0: d = d & s"}
  - {value: 3,  name: BIC,  description: "cls=00, fn=01, inv=1: d = d & ~s"}
  - {value: 4,  name: OR,   description: "cls=00, fn=10, inv=0: d = d | s"}
  - {value: 5,  name: ORN,  description: "cls=00, fn=10, inv=1: d = d | ~s"}
  - {value: 6,  name: XOR,  description: "cls=00, fn=11, inv=0: d = d ^ s"}
  - {value: 7,  name: XNOR, description: "cls=00, fn=11, inv=1: d = d ^ ~s"}
  - {value: 8,  name: ADD,  description: "cls=01, fn=00, sub=0, cin_sel=0: d = d + s"}
  - {value: 10, name: ADC,  description: "cls=01, fn=01, sub=0, cin_sel=1: d = d + s + C"}
  - {value: 13, name: SUB,  description: "cls=01, fn=10, sub=1, cin_sel=0: d = d - s; C = not borrow"}
  - {value: 15, name: SBC,  description: "cls=01, fn=11, sub=1, cin_sel=1: d = d - s - (1-C)"}
  - {value: 16, name: ROR,  description: "cls=10, fn=00: 16-bit rotate right by s[3:0]"}
  - {value: 18, name: SHR,  description: "cls=10, fn=01: logical shift right"}
  - {value: 20, name: SAR,  description: "cls=10, fn=10: arithmetic shift right"}
  - {value: 24, name: MUL,  description: "cls=11, fn=00: d = (d * s)[15:0] signed; high 16 to MHI"}
  - {value: 28, name: TST,  description: "cls=11, fn=10: d & s, result discarded, flags written"}
  - {value: 30, name: CMP,  description: "cls=11, fn=11: d - s, result discarded, flags written"}
notes:
  - "Writing to ZERO discards the result. NOP = MOV ZERO, ZERO."
  - "TST/CMP are encoded in the assembler with WRITE=0; dedicated opcodes 28/30 are equivalent to AND/SUB with WRITE=0."
---
kind: enum
name: conditions
title: "COND (4 bits, ARM-style)"
width: 4
entries:
  - {value: 0,  name: AL, description: "Always"}
  - {value: 1,  name: EQ, description: "Z=1"}
  - {value: 2,  name: NE, description: "Z=0"}
  - {value: 3,  name: CS, description: "C=1 (unsigned >=)"}
  - {value: 4,  name: CC, description: "C=0 (unsigned <)"}
  - {value: 5,  name: MI, description: "N=1"}
  - {value: 6,  name: PL, description: "N=0"}
  - {value: 7,  name: VS, description: "V=1"}
  - {value: 8,  name: VC, description: "V=0"}
  - {value: 9,  name: HI, description: "C=1 and Z=0"}
  - {value: 10, name: LS, description: "C=0 or Z=1"}
  - {value: 11, name: GE, description: "N=V"}
  - {value: 12, name: LT, description: "N!=V"}
  - {value: 13, name: GT, description: "Z=0 and N=V"}
  - {value: 14, name: LE, description: "Z=1 or N!=V"}
  - {value: 15, name: NV, description: "Never (default=false)"}
---
kind: enum
name: ctrl_ops
title: "CTRL OP (J=1, I=0)"
width: 5
entries:
  - {value: 0, name: NOP,   description: "Nothing"}
  - {value: 1, name: JMP,   description: "PC = ADDR (11 bits)"}
  - {value: 2, name: CALL,  description: "SHADOW[15:12] = flags, SHADOW[11:0] = PC+1; PC = ADDR"}
  - {value: 3, name: RET,   description: "PC = SHADOW[11:0]; flags not restored"}
  - {value: 4, name: JMPR,  description: "PC = operand[DST_CODE][11:0]"}
  - {value: 5, name: HALT,  description: "ADDR=0 -> IDLE; ADDR!=0 -> ERROR(code)"}
  - {value: 6, name: IRQ,   description: "Raise IRQ, code = ADDR"}
  - {value: 7, name: FLUSH, description: "Flush cache channel ADDR[1:0]"}
---
kind: enum
name: operand_map
title: "Operand map (6 bits, 0..63)"
width: 6
radix: dec
columns:
  - {key: value, title: "Code"}
  - {key: name, title: "Name"}
  - {key: read, title: "Read"}
  - {key: write, title: "Write"}
entries:
  - {value: "0..31", name: "R0..R31", read: "16-bit value", write: "16-bit value"}
  - {value: 32, name: "ZERO",     read: "0", write: "Ignored"}
  - {value: 33, name: "FLAGS",    read: "[3:0] = V C N Z", write: "[3:0]"}
  - {value: 34, name: "SHADOW",   read: "[15:12] flags, [11:0] PC+1", write: "[11:0] PC"}
  - {value: 35, name: "LOOP_CNT", read: "Loop counter", write: "Loop counter"}
  - {value: 36, name: "LOOP_TGT", read: "Loop target", write: "Loop target"}
  - {value: 37, name: "BUSY",     read: "{wb_cyc, flush_done, access_done, hit}", write: "-"}
  - {value: 38, name: "MHI",      read: "Upper 16 bits of MUL", write: "-"}
  - {value: 39, name: "reserved", read: "0", write: "-"}
  - {value: "40..43", name: "DATA[0..3]", read: "pixel_out from channel ch", write: "pixel_in to channel ch"}
  - {value: "44..47", name: "reserved", read: "0", write: "-"}
  - {value: "48..63", name: "CH[ch]_{IDX,IDXH,STEP,MODE_PAGE}", read: "-", write: "Write-only channel register"}