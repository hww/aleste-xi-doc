# ============================================================
# Timing diagrams for LX-GPU nodes (derived from RTL)
# ============================================================

kind: timing
name: timing_regfile
title: "regfile: write mem_R5 (t2), read q_a (t2), bypass (t1, same-cycle)"
signals:
  - {name: clk,     type: clock}
  - {name: we,      states: ["0", "1", "0", "0", "0"]}
  - {name: wa,      states: ["-", "R5", "-", "-", "-"]}
  - {name: wdata,   states: ["-", "1234", "-", "-", "-"]}
  - {name: mem_R5,  states: ["oldR5", "oldR5", "1234", "1234", "1234"]}
  - {name: ra,      states: ["R5", "R5", "R5", "R5", "R5"]}
  - {name: q_a,     states: ["oldR5", "oldR5", "1234", "1234", "1234"]}
  - {name: rdata_a, states: ["oldR5", "1234", "1234", "1234", "1234"]}
---
kind: timing
name: timing_alu
title: "alu: combinational compute (0 cyc), MHI registered on MUL (1 cyc)"
signals:
  - {name: clk,  type: clock}
  - {name: op,   states: ["MOV", "MUL", "ADD", "AND", "SUB"]}
  - {name: a,    states: ["0010", "03E8", "0001", "FF00", "1000"]}
  - {name: b,    states: ["0020", "03E8", "0001", "0FF0", "2000"]}
  - {name: res,  states: ["0020", "4240", "0002", "0F00", "F000"]}
  - {name: mhi,  states: ["0000", "000F", "000F", "000F", "000F"]}
  - {name: z,    states: ["0", "0", "0", "0", "0"]}
  - {name: c,    states: ["0", "0", "0", "0", "0"]}
---
kind: timing
name: timing_sequencer
title: "sequencer: PC fetch and next-PC (1 cyc per instruction)"
signals:
  - {name: clk,       type: clock}
  - {name: ack,       states: ["1", "1", "1", "0", "1", "1"]}
  - {name: pc,        states: ["100", "101", "102", "102", "102", "103"]}
  - {name: imm_class, states: ["00", "00", "10", "10", "10", "00"]}
  - {name: reg_op,    states: ["-", "-", "JMP", "JMP", "JMP", "-"]}
  - {name: cond,      states: ["AL", "AL", "AL", "AL", "AL", "AL"]}
  - {name: pc_next,   states: ["101", "102", "200", "200", "200", "103"]}
---
kind: timing
name: timing_microcode_rom
title: "microcode_rom: synchronous read latched on ack; data holds during stall"
signals:
  - {name: clk,  type: clock}
  - {name: ack,  states: ["0", "1", "0", "1", "1", "1", "0", "1"]}
  - {name: addr, states: ["100", "100", "100", "101", "102", "103", "103", "104"]}
  - {name: data, states: ["----", "1000", "1000", "1001", "1002", "1003", "1003", "1004"]}
---
kind: timing
name: timing_gpu_cache
title: "gpu_cache: hit (1 cyc), miss/fill (3+ cyc)"
signals:
  - {name: clk,         type: clock}
  - {name: access,      states: ["0", "1", "1", "0", "0", "1", "1", "0"]}
  - {name: hit,         states: ["-", "1", "0", "0", "0", "0", "1", "1"]}
  - {name: state,       states: ["IDLE", "IDLE", "FILL", "FILL", "IDLE", "IDLE", "IDLE", "IDLE"]}
  - {name: wb_cyc_o,    states: ["0", "0", "1", "1", "0", "0", "0", "0"]}
  - {name: wb_ack_i,    states: ["0", "0", "0", "1", "0", "0", "0", "0"]}
  - {name: access_done, states: ["0", "1", "0", "0", "1", "0", "1", "0"]}
---
kind: timing
name: timing_pixel_blender
title: "pixel_blender: IDLE -> CAPTURE -> FREE -> IDLE (3 cyc)"
signals:
  - {name: clk,        type: clock}
  - {name: start,      states: ["0", "1", "0", "0", "0", "1", "0"]}
  - {name: bstate,     states: ["IDLE", "CAPTURE", "FREE", "IDLE", "IDLE", "CAPTURE", "FREE"]}
  - {name: pixel_out,  states: ["----", "1234", "1234", "1234", "----", "5678", "5678"]}
  - {name: word_out,   states: ["----", "----", "ABCD", "ABCD", "----", "----", "EF01"]}
  - {name: ack,        states: ["0", "0", "1", "0", "0", "0", "1"]}
---
kind: timing
name: timing_alu_pipeline
title: "ALU instruction: read (t1), compute (comb, 0 cyc), write (t2), result holds (t3)"
signals:
  - {name: clk,     type: clock}
  - {name: insn,    states: ["ADD R5,R7", "-", "-", "-", "-"]}
  - {name: ra,      states: ["R5", "-", "-", "-", "-"]}
  - {name: rb,      states: ["R7", "-", "-", "-", "-"]}
  - {name: mem_R5,  states: ["oldR5", "oldR5", "R5+R7", "R5+R7", "R5+R7"]}
  - {name: mem_R7,  states: ["oldR7", "oldR7", "oldR7", "oldR7", "oldR7"]}
  - {name: q_a,     states: ["oldR5", "R5", "R5", "R5", "R5"]}
  - {name: q_b,     states: ["oldR7", "R7", "R7", "R7", "R7"]}
  - {name: rdata_a, states: ["oldR5", "R5", "R5", "R5", "R5"]}
  - {name: rdata_b, states: ["oldR7", "R7", "R7", "R7", "R7"]}
  - {name: alu_res, states: ["oldADD", "R5+R7", "R5+R7", "R5+R7", "R5+R7"]}
  - {name: we,      states: ["0", "1", "0", "0", "0"]}
  - {name: wa,      states: ["-", "R5", "-", "-", "-"]}
  - {name: wdata,   states: ["-", "R5+R7", "-", "-", "-"]}
---
kind: timing
name: timing_top_data
title: "top: DATA read (3 cyc: cache + blender)"
signals:
  - {name: clk,            type: clock}
  - {name: pc,             states: ["100", "100", "100", "100", "101"]}
  - {name: gc_access,      states: ["0", "1", "1", "0", "0"]}
  - {name: gc_access_done, states: ["0", "0", "1", "0", "0"]}
  - {name: pb_start,       states: ["0", "0", "1", "0", "0"]}
  - {name: pb_ack,         states: ["0", "0", "0", "1", "0"]}
  - {name: ack,            states: ["0", "0", "0", "1", "1"]}