kind: table
name: operand_map
title: "Карта операндов микрокода"
columns:
  - {key: address, label: "Адрес"}
  - {key: name, label: "Имя", bold: true}
  - {key: read, label: "Чтение"}
  - {key: write, label: "Запись"}
rows:
  - {address: "0–31", name: "R0–R31",  read: "Регистровый файл, 24 бита", write: "То же"}
  - {address: "32",   name: "ZERO",    read: "0",                        write: "Игнорируется"}
  - {address: "33",   name: "ACC",     read: "Результат предыдущей операции", write: "—"}
  - {address: "34",   name: "SPIX",    read: "Пиксель источника (SW)",  write: "—"}
  - {address: "35",   name: "DPIX",    read: "Пиксель приёмника (DW)",  write: "Запись в DW, dirty"}
  - {address: "36",   name: "SIDX",    read: "—",                       write: "Индекс источника"}
  - {address: "37",   name: "DIDX",    read: "—",                       write: "Индекс приёмника"}
  - {address: "38",   name: "DPTR",    read: "—",                       write: "Индекс потока данных"}
  - {address: "39",   name: "FLAG",    read: "Z, N, C",                 write: "—"}
  - {address: "40",   name: "CNT",     read: "Счётчик цикла",           write: "Загрузка (LDCNT)"}