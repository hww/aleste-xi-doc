kind: regmap
name: ms2a_channel_map
title: "Rev. A: Channel Registers Map (Base 0x20/0x30/0x40/0x50)"
width: 8
view: [diagram, table]
registers:
  - offset: 0x0
    name: "CH_CTRL"
    fields:
      - {name: "EN",    bit: 0,      description: "Enable"}
      - {name: "LOOP",  bit: 1,      description: "Loop"}
      - {name: "PP",    bit: 2,      description: "Ping-pong"}
      - {name: "IRQ",   bit: 3,      description: "IRQ on EOF"}
      - {name: "VOL_L", bits: [7,4], description: "Volume L (4-bit)"}
      - {name: "VOL_R", bits: [3,0], description: "Volume R (4-bit)", overlay: true}
  - offset: 0x1
    name: "START_ADDR_0"
    fields: [{name: "ADDR", bits: [7,0], description: "Start address [7:0]"}]
  - offset: 0x2
    name: "START_ADDR_1"
    fields: [{name: "ADDR", bits: [7,0], description: "Start address [15:8]"}]
  - offset: 0x3
    name: "START_ADDR_2"
    fields: [{name: "ADDR", bits: [7,0], description: "Start address [23:16]"}]
  - offset: 0x4
    name: "END_ADDR_0"
    fields: [{name: "ADDR", bits: [7,0], description: "End address [7:0]"}]
  - offset: 0x5
    name: "END_ADDR_1"
    fields: [{name: "ADDR", bits: [7,0], description: "End address [15:8]"}]
  - offset: 0x6
    name: "END_ADDR_2"
    fields: [{name: "ADDR", bits: [7,0], description: "End address [23:16]"}]
  - offset: 0x7
    name: "LOOP_START_0"
    fields: [{name: "ADDR", bits: [7,0], description: "Loop start [7:0]"}]
  - offset: 0x8
    name: "LOOP_START_1"
    fields: [{name: "ADDR", bits: [7,0], description: "Loop start [15:8]"}]
  - offset: 0x9
    name: "LOOP_START_2"
    fields: [{name: "ADDR", bits: [7,0], description: "Loop start [23:16]"}]
  - offset: 0xA
    name: "LOOP_END_0"
    fields: [{name: "ADDR", bits: [7,0], description: "Loop end [7:0]"}]
  - offset: 0xB
    name: "LOOP_END_1"
    fields: [{name: "ADDR", bits: [7,0], description: "Loop end [15:8]"}]
  - offset: 0xC
