    fields: [{name: "ADDR", bits: [7,0], description: "Loop end [23:16]"}]
  - offset: 0xD
    name: "STEP_0"
    fields: [{name: "STEP", bits: [7,0], description: "Step fraction [7:0]"}]
  - offset: 0xE
    name: "STEP_1"
    fields: [{name: "STEP", bits: [7,0], description: "Step fraction [15:8]"}]
  - offset: 0xF
    name: "STEP_2"
    fields: [{name: "STEP", bits: [7,0], description: "Step integer [23:16]"}]