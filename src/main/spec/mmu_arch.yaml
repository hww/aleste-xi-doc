# ============================================================
# GLOBAL_CTRL (F0h)
# ============================================================
kind: bitfield
name: mmu_global_ctrl
title: "GLOBAL_CTRL (F0h)"
width: 8
fields:
  - name: "supervisor_mode"
    bit: 0
    enum: supervisor_mode_vals
    description: "0 = User, 1 = Supervisor. Hardware trap entry on 0038h/0066h."
  - name: "native_mode"
    bit: 1
    enum: native_mode_vals
    description: "0 = Legacy (CPC 6128), 1 = Native (LX). Ignored in Supervisor mode."
  - name: "supervisor_hook"
    bit: 2
    description: "0 = disabled, 1 = enabled. Enables hardware entry into Supervisor mode on M1 at 0038h (IM 1) or 0066h (NMI)."
  - name: "interrupt_hold"
    bit: 3
    description: "1 = block INT to CPU (set on syscall entry/exit, released by kernel or on RET)"
  - name: "mmio_userlock"
    bit: 4
    description: "0 = unlocked, 1 = locked. Blocks all MMU ports (E0–FF) in User mode. Only Supervisor can change this bit."
  - name: "RSV"
    bits: [7,5]
    reserved: true
---
# ============================================================
# Supervisor mode values
# ============================================================
kind: enum
name: supervisor_mode_vals
title: "supervisor_mode (GLOBAL_CTRL[0])"
width: 1
entries:
  - {value: 0, name: "User",       description: "Application code; access to slots and I/O is restricted"}
  - {value: 1, name: "Supervisor", description: "Kernel code; full access to all resources; hardware trap entry"}
---
# ============================================================
# Native mode values
# ============================================================
kind: enum
name: native_mode_vals
title: "native_mode (GLOBAL_CTRL[1])"
width: 1
entries:
  - {value: 0, name: "Legacy", description: "CPC 6128 compatibility; ignored in Supervisor mode"}
  - {value: 1, name: "Native", description: "Extended LX mode with slot/bank MMU"}
---
# ============================================================
# Logical Slots (16-bit logical address space)
# ============================================================
kind: memmap
name: mmu_slots
title: "Logical Slots (16-bit Z80 address space)"
width: 16
regions:
  - {name: "Slot 0 — CPC RAM",           start: 0x0000, end: 0x3FFF, purpose: "Base memory"}
  - {name: "Slot 1 — CPC ROM",           start: 0x4000, end: 0x7FFF, purpose: "System firmware"}
  - {name: "Slot 2 — User extended",     start: 0x8000, end: 0xBFFF, purpose: "User extended memory"}
  - {name: "Slot 3 — Supervisor memory", start: 0xC000, end: 0xFFFF, purpose: "Privileged memory"}
---
# ============================================================
# Internal Mapper Registers (16 × 8-bit)
# ============================================================
kind: regmap
name: mmu_mapper_regs
title: "Internal Mapper Registers (16 × 8-bit)"
width: 8
view: [table]
registers:
  - {offset: 0,  name: "MAPPER_0",  access: rw, reset: 0x00, description: "Slot 0, page 0"}
  - {offset: 1,  name: "MAPPER_1",  access: rw, reset: 0x00, description: "Slot 0, page 1"}
  - {offset: 2,  name: "MAPPER_2",  access: rw, reset: 0x00, description: "Slot 0, page 2"}
  - {offset: 3,  name: "MAPPER_3",  access: rw, reset: 0x00, description: "Slot 0, page 3"}
  - {offset: 4,  name: "MAPPER_4",  access: rw, reset: 0x00, description: "Slot 1, page 0"}
  - {offset: 5,  name: "MAPPER_5",  access: rw, reset: 0x00, description: "Slot 1, page 1"}
  - {offset: 6,  name: "MAPPER_6",  access: rw, reset: 0x00, description: "Slot 1, page 2"}
  - {offset: 7,  name: "MAPPER_7",  access: rw, reset: 0x00, description: "Slot 1, page 3"}
  - {offset: 8,  name: "MAPPER_8",  access: rw, reset: 0x00, description: "Slot 2, page 0"}
  - {offset: 9,  name: "MAPPER_9",  access: rw, reset: 0x00, description: "Slot 2, page 1"}
  - {offset: 10, name: "MAPPER_10", access: rw, reset: 0x00, description: "Slot 2, page 2"}
  - {offset: 11, name: "MAPPER_11", access: rw, reset: 0x00, description: "Slot 2, page 3"}
  - {offset: 12, name: "MAPPER_12", access: rw, reset: 0x00, description: "Slot 3, page 0"}
  - {offset: 13, name: "MAPPER_13", access: rw, reset: 0x00, description: "Slot 3, page 1"}
  - {offset: 14, name: "MAPPER_14", access: rw, reset: 0x00, description: "Slot 3, page 2"}
  - {offset: 15, name: "MAPPER_15", access: rw, reset: 0x00, description: "Slot 3, page 3"}
---
# ============================================================
# Control Registers (Ports F0–FF, E0–EF)
# ============================================================
kind: regmap
name: mmu_ports
title: "Control Registers (Ports F0–FF, E0–EF)"
width: 8
view: [table]
registers:
  - {offset: 0xF0, name: "GLOBAL_CTRL", access: rw, reset: 0x13, description: "Mode control (supervisor=1, native=1, lock=1)"}
  - {offset: 0xF1, name: "MMIO_PAGE",   access: rw, reset: 0x00, description: "7-bit MMIO page"}
  - {offset: 0xF2, name: "SYSCALL",     access: wo,                 description: "Supervisor entry (write-only)"}
  - {offset: 0xF3, name: "CLOCK_CTRL",  access: rw, reset: 0x02, description: "CPU clock divider (Supervisor only), divide by 4"}
  - {offset: 0xFA, name: "SUPER_SLOT",  access: rw, reset: 0xFF, description: "Supervisor slot select (all pages → slot 3)"}
  - {offset: 0xFB, name: "USER_SLOT",   access: rw, reset: 0x00, description: "User slot select (all pages → slot 0)"}
  - {offset: 0xFC, name: "BANK_0",      access: rw, reset: 0x00, description: "Bank register for current slot, page 0"}
  - {offset: 0xFD, name: "BANK_1",      access: rw, reset: 0x00, description: "Bank register for current slot, page 1"}
  - {offset: 0xFE, name: "BANK_2",      access: rw, reset: 0x00, description: "Bank register for current slot, page 2"}
  - {offset: 0xFF, name: "BANK_3",      access: rw, reset: 0x00, description: "Bank register for current slot, page 3"}
  - {offset: 0xE0, name: "MMU_EXT",     access: rw,                 description: "Extended mapper access, ports E0–EF (CPU only)"}