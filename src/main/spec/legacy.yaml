# --- Gate Array Registers ---
kind: enum
name: L_GA_REGS
title: "Gate Array register select (D7, D6)"
width: 2
entries:
  - {value: "0b00", name: "R0", description: "Palette index (D7=0, D6=0)"}
  - {value: "0b01", name: "R1", description: "Palette data (D7=0, D6=1)"}
  - {value: "0b10", name: "R2", description: "Mode, ROM enable, LEDs (D7=1, D6=0)"}
  - {value: "0b11", name: "R3", description: "RAM banking (D7=1, D6=1)"}
---
kind: bitfield
name: L_GA_R0
title: "Gate Array R0 — Palette Index"
width: 8
fields:
  - {name: "SEL", bits: [7,6], description: "Must be 00"}
  - {name: "UNUSED", bit: 5, description: "Not used"}
  - {name: "INDEX", bits: [4,0], description: "00h–0Fh=Ink, 10h=Border, 11h–1Fh=Border"}
---
kind: bitfield
name: L_GA_R2
title: "Gate Array R2 — Mode, ROM Enable, LEDs"
width: 8
fields:
  - {name: "B7", bit: 7, value: 1, description: "Must be 1"}
  - {name: "B6", bit: 6, value: 0, description: "Must be 0"}
  - {name: "CAPS", bit: 5, description: "CAPS LED"}
  - {name: "RUS", bit: 4, description: "RUS LED"}
  - {name: "UPPER_ROM", bit: 3, description: "1=disabled, 0=enabled"}
  - {name: "LOWER_ROM", bit: 2, description: "1=disabled, 0=enabled"}
  - {name: "MODE", bits: [1,0], description: "0=160x200, 1=320x200, 2=640x200"}
---
# --- PPI Registers ---
kind: bitfield
name: L_PPI_PORTA
title: "8255 PPI Port A — PSG Data Bus"
width: 8
fields:
  - {name: "PSG_DATA", bits: [7,0], description: "PSG data bus"}
---
kind: bitfield
name: L_PPI_PORTB
title: "8255 PPI Port B — VSYNC, Cassette, Printer"
width: 8
fields:
  - {name: "CASSETTE", bit: 7, description: "Cassette data"}
  - {name: "PRNBUSY", bit: 6, description: "1=busy, 0=ready"}
  - {name: "EXP", bit: 5, description: "Expansion signal"}
  - {name: "REFRESH", bit: 4, description: "1=50Hz, 0=60Hz"}
  - {name: "MFG", bits: [3,1], enum: L_PPI_MFG, description: "Manufacturer code"}
  - {name: "VSYNC", bit: 0, description: "1=active"}
---
kind: bitfield
name: L_PPI_PORTC
title: "8255 PPI Port C — PSG Control, Cassette, Keyboard"
width: 8
fields:
  - {name: "BDIR", bit: 7, description: "PSG BDIR"}
  - {name: "BC1", bit: 6, description: "PSG BC1"}
  - {name: "CASS_WR", bit: 5, description: "Cassette write data"}
  - {name: "CASS_MOT", bit: 4, description: "Cassette motor (1=on)"}
  - {name: "KB_LINE", bits: [3,0], description: "Keyboard row select (0–15)"}
---
kind: enum
name: L_PSG_SELECT
title: "PSG function select (BDIR, BC1)"
width: 2
entries:
  - {value: "0b00", name: "Inactive", description: "No operation"}
  - {value: "0b01", name: "Read",     description: "Read from selected PSG register"}
  - {value: "0b10", name: "Write",    description: "Write to selected PSG register"}
  - {value: "0b11", name: "Select",   description: "Select PSG register"}
---
kind: enum
name: L_PPI_MFG
title: "PPI Manufacturer Bits (Port B bits 3–1)"
width: 3
entries:
  - {value: "0b000", name: "Isp",       description: "Manufacturer Isp"}
  - {value: "0b001", name: "Triumph",   description: "Manufacturer Triumph"}
  - {value: "0b010", name: "Saisho",    description: "Manufacturer Saisho"}
  - {value: "0b011", name: "Solavox",   description: "Manufacturer Solavox"}
  - {value: "0b100", name: "Awa",       description: "Manufacturer Awa"}
  - {value: "0b101", name: "Schneider", description: "Manufacturer Schneider"}
  - {value: "0b110", name: "Orion",     description: "Manufacturer Orion"}
  - {value: "0b111", name: "Amstrad",   description: "Manufacturer Amstrad"}
---
kind: bitfield
name: L_RMR
title: "RMR — Control, ROM Mapping, Graphics Mode"
width: 8
fields:
  - {name: "B7", bit: 7, value: 1, description: "Must be 1"}
  - {name: "B6", bit: 6, value: 0, description: "Must be 0"}
  - {name: "B5", bit: 5, value: 0, description: "Must be 0 (Plus ASIC unlocked)"}
  - {name: "IRQ_CTRL", bit: 4, description: "Interrupt control"}
  - {name: "UPPER_ROM", bit: 3, description: "1=disabled, 0=enabled"}
  - {name: "LOWER_ROM", bit: 2, description: "1=disabled, 0=enabled"}
  - {name: "GRAPHIC_MODE", bits: [1,0], description: "Graphics mode"}
---
kind: bitfield
name: L_MMR
title: "MMR — RAM Memory Mapping"
width: 8
fields:
  - {name: "B7", bit: 7, value: 1, description: "Must be 1"}
  - {name: "B6", bit: 6, value: 1, description: "Must be 1"}
  - {name: "BBB", bits: [5,3], description: "Upper bank number"}
  - {name: "CCC", bits: [2,0], description: "Configuration"}
---
kind: bitfield
name: L_520EX_EXTPORT
title: "EXTPORT (FABF) — 520EX Extension"
width: 8
fields:
  - {name: "B7_6", bits: [7,6], description: "Not used"}
  - {name: "PPI_A", bits: [5,4], description: "PPI Port A: 0=PSG, 1=reserved, 2=RTC, 3=8253"}
  - {name: "BLACK", bit: 3, description: "Force video to black"}
  - {name: "MAPMOD", bit: 2, description: "0=CPC-style, 1=64-colour"}
  - {name: "HIGHX", bit: 1, description: "High resolution in X"}
  - {name: "HIZ", bit: 0, description: "Not fully understood"}