kind: bitfield
name: timer_f6_bits
title: "Timer F6 bit layout"
view: [diagram, table]
width: 8
fields:
  - {bit: 0, name: ENABLE,
     description: "R: comparison enabled. W: 1 = enable, 0 = disable (supervisor only)"}
  - {bit: 1, name: ARMED,
     description: "R: target timestamp has been committed. W: ignored"}
  - {bit: 2, name: WINDOW,
     description: "R: COMPARE write in progress (F4 written, F5 not yet; blocks INT, not NMI). W: ignored"}
  - {bit: 3, name: DUE,
     description: "R: live comparator output (ARMED & ~delta[15]). W: ignored"}
  - {bit: 4, name: FIRED,
     description: "R: the request for the current target has been sent; cleared by the F5 commit. W: ignored"}
  - {bits: [7,5], name: RSV, reserved: true}