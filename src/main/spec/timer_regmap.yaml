kind: regmap
name: timer_regmap
title: "System Timer Port Map (lx_sys.sv)"
width: 8
view: [diagram, table]
registers:
  - offset: "0xF4"
    name: "RT_LO / CMP_LO"
    access: rw
    fields:
      - {name: "RT_LO",  bits: [7,0],
         description: "R: latches the full 16-bit RT into the snapshot of the current mode (supervisor/user); returns its low byte"}
      - {name: "CMP_LO", bits: [7,0], overlay: true,
         description: "W: buffer low byte of COMPARE and open WINDOW (supervisor only)"}

  - offset: "0xF5"
    name: "RT_HI / CMP_HI"
    access: rw
    fields:
      - {name: "RT_HI",  bits: [7,0],
         description: "R: high byte of the current mode's RT_SNAPSHOT"}
      - {name: "CMP_HI", bits: [7,0], overlay: true,
         description: "W: commit high byte; full 16-bit COMPARE is written atomically; ARMED = ENABLE = 1, FIRED = 0, WINDOW = 0 (supervisor only)"}

  - offset: "0xF6"
    name: "STATUS / CONTROL"
    access: rw
    fields:
      - {name: "ENABLE", bit: 0,
         description: "R: comparison enabled. W: 1 = enable, 0 = disable (supervisor only)"}
      - {name: "ARMED",  bit: 1,
         description: "R: target timestamp has been committed. W: ignored"}
      - {name: "WINDOW", bit: 2,
         description: "R: COMPARE write in progress (F4 written, F5 not yet; blocks INT, not NMI). W: ignored"}
      - {name: "DUE",    bit: 3,
         description: "R: live comparator output (ARMED & ~delta[15]). W: ignored"}
      - {name: "FIRED",  bit: 4,
         description: "R: the request for the current target has been sent; cleared by the F5 commit. W: ignored"}
      - {name: "RSV",    bits: [7,5], reserved: true}

