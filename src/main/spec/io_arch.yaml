# ============================================================
# Memory Slots
# ============================================================
kind: memmap
name: io_slots
title: "Logical Slots"
width: 16
regions:
  - {name: "Slot 0 — CPC RAM",           start: 0x0000, end: 0x3FFF, purpose: "Base memory"}
  - {name: "Slot 1 — CPC ROM",           start: 0x4000, end: 0x7FFF, purpose: "System firmware"}
  - {name: "Slot 2 — User extended",     start: 0x8000, end: 0xBFFF, purpose: "User extended memory"}
  - {name: "Slot 3 — Supervisor memory", start: 0xC000, end: 0xFFFF, purpose: "Privileged memory"}
---
# ============================================================
# MMIO Regions
# ============================================================
kind: enum
name: io_mmio_regions
title: "MMIO Regions"
width: 1
entries:
  - {value: 0, name: "MMIO_LO", description: "New LX devices (bank-switched)"}
  - {value: 1, name: "MMIO_HI", description: "Legacy CPC devices (fixed addresses)"}
---
# ============================================================
# Native Mode Port Map
# ============================================================
kind: enum
name: io_native_ports
title: "Native Mode Port Map"
width: 8
entries:
  - {value: "0x00..0x7F", name: "MMIO window",   description: "128 bytes: access to MMIO_LO"}
  - {value: "0x80..0xDF", name: "External I/O",  description: "96 bytes: forwarded to Wishbone"}
  - {value: "0xE0..0xFF", name: "MMU registers", description: "32 bytes: MMU control"}
---
# ============================================================
# MMU Registers (Native mode)
# ============================================================
kind: regmap
name: io_mmu_ports
title: "MMU Registers (Ports E0–FF)"
width: 8
view: [table]
registers:
  - {offset: 0xE0, name: "MMU_EXT",     description: "Extended mapper access (16 registers, save/restore)"}
  - {offset: 0xF0, name: "GLOBAL_CTRL", description: "Mode control: bit 0 = supervisor, bit 1 = native, bit 2 = trap hook, bit 4 = mmio_userlock"}
  - {offset: 0xF1, name: "MMIO_PAGE",   description: "7-bit MMIO page (0–127)"}
  - {offset: 0xF2, name: "SYSCALL",     description: "Supervisor entry (write-only)"}
  - {offset: 0xF3, name: "CLOCK_CTRL",  description: "CPU clock divider (Supervisor only)"}
  - {offset: 0xFA, name: "SUPER_SLOT",  description: "Supervisor slot select (4 × 2-bit page fields)"}
  - {offset: 0xFB, name: "USER_SLOT",   description: "User slot select (4 × 2-bit page fields)"}
  - {offset: 0xFC, name: "BANK_0",      description: "Bank register for current slot, page 0"}
  - {offset: 0xFD, name: "BANK_1",      description: "Bank register for current slot, page 1"}
  - {offset: 0xFE, name: "BANK_2",      description: "Bank register for current slot, page 2"}
  - {offset: 0xFF, name: "BANK_3",      description: "Bank register for current slot, page 3"}
---
# ============================================================
# Legacy Mode Capabilities
# ============================================================
kind: enum
name: io_legacy_can
title: "Legacy Software CAN"
width: 2
entries:
  - {value: 0, name: "Native CPC ports", description: "7Fxx, BCXX, BDXX, DFXX, F4XX–F7XX, FA7E, FB7E, FB7F"}
  - {value: 1, name: "Enter Supervisor", description: "SYSCALL (in Legacy, the syscall port is F2xx)"}
  - {value: 2, name: "IPC mailbox",      description: "via the Supervisor"}
---
kind: enum
name: io_legacy_cannot
title: "Legacy Software CANNOT"
width: 2
entries:
  - {value: 0, name: "Direct MMIO_LO access", description: "No D0XX/D300 window"}
  - {value: 1, name: "Direct access to PIC, Timer, RTC, Blitter, Sound", description: "Not mapped in Legacy"}
  - {value: 2, name: "Any modern LX device",  description: "Only via syscall"}
---
# ============================================================
# MMIO_LO Page Map
# ============================================================
kind: enum
name: io_mmio_pages
title: "MMIO_LO Page Map"
width: 7
entries:
  - {value: 0, name: "Page 0", description: "(verify against RTL)"}
  - {value: 2, name: "Page 2", description: "Legacy emulation"}
  - {value: 4, name: "Page 4", description: "(verify against RTL)"}
  - {value: 6, name: "Page 6", description: "Blitter (1 channel, 8-bit, copy/fill/transparent)"}
  - {value: 8, name: "Page 8", description: "Sound chip"}
---
# ============================================================
# Legacy Device Sub-registers
# ============================================================
kind: enum
name: io_legacy_devices
title: "Legacy Device Sub-registers"
width: 4
entries:
  - {value: 0,  name: "Gate Array",       description: "CPC 7Fxx (D7/D6), RTL implemented, LX Mandatory"}
  - {value: 1,  name: "CRTC 6845",        description: "CPC BCXX/BDXX, RTL implemented, LX Mandatory"}
  - {value: 2,  name: "PPI 8255",         description: "CPC F4XX–F7XX, RTL implemented, LX Mandatory"}
  - {value: 3,  name: "FDC 765",          description: "CPC FA7E/FB7E/FB7F, RTL implemented, LX Mandatory"}
  - {value: 4,  name: "Upper ROM Select", description: "CPC DFXX, RTL implemented, LX Mandatory"}
  - {value: 5,  name: "Printer port",     description: "CPC EFXX (via PPI), Optional"}
  - {value: 6,  name: "Cassette tape",    description: "CPC (via PPI), Optional"}
  - {value: 7,  name: "Joysticks",        description: "CPC (via PPI/keyboard), Optional"}
  - {value: 8,  name: "SIO/DART",         description: "CPC FADC–FADF, RTL not implemented, Optional"}
  - {value: 9,  name: "8253 Timer",       description: "CPC FBDC–FBDF, RTL not implemented, Optional"}
---
# ============================================================
# Gate Array Register Select
# ============================================================
kind: enum
name: io_ga_regs
title: "Gate Array Register Select (7Fxx)"
width: 2
entries:
  - {value: "0b00", name: "R0", description: "Palette index (D7=0, D6=0)"}
  - {value: "0b01", name: "R1", description: "Palette data (D7=0, D6=1)"}
  - {value: "0b10", name: "R2", description: "Mode, ROM enable, LEDs (D7=1, D6=0)"}
  - {value: "0b11", name: "R3", description: "RAM banking (D7=1, D6=1)"}
---
# ============================================================
# CRTC Ports
# ============================================================
kind: enum
name: io_crtc_ports
title: "CRTC 6845 Ports"
width: 2
entries:
  - {value: "0b00", name: "BCXX", description: "Index register (W)"}
  - {value: "0b01", name: "BDXX", description: "Data register (W)"}
  - {value: "0b10", name: "BEXX", description: "Status register (R)"}
  - {value: "0b11", name: "BFXX", description: "Data register (R)"}
---
# ============================================================
# PPI Ports
# ============================================================
kind: enum
name: io_ppi_ports
title: "PPI 8255 Ports"
width: 2
entries:
  - {value: "0b00", name: "F4XX", description: "Port A (PSG data), RW"}
  - {value: "0b01", name: "F5XX", description: "Port B (Vsync, PrnBusy, Tape), R"}
  - {value: "0b10", name: "F6XX", description: "Port C (KeybRow, Tape, PSG Control), W"}
  - {value: "0b11", name: "F7XX", description: "Control register, W"}
---
# ============================================================
# FDC Ports
# ============================================================
kind: enum
name: io_fdc_ports
title: "FDC 765 Ports"
width: 2
entries:
  - {value: "0b00", name: "FA7E", description: "Floppy motor control (W)"}
  - {value: "0b01", name: "FB7E", description: "FDC status register (R)"}
  - {value: "0b10", name: "FB7F", description: "FDC data register (R/W)"}