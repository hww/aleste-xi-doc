# ============================================================
# FDC Ports
# ============================================================
kind: code_list
name: io_fdc_ports
title: "FDC 765 Ports"
fields: [port, function, rw]
entries:
  - {port: "FA7E", function: "Floppy motor control", rw: "W"}
  - {port: "FB7E", function: "FDC status register", rw: "R"}
  - {port: "FB7F", function: "FDC data register", rw: "R/W"}