kind: regmap
name: dma_blitter_map
title: "Blitter Register Map (lx_dma.sv)"
width: 8
view: [table]

registers:
  - offset: 0x00
    name: "CTRL"
    fields:
      - {name: "START", bit: 0, description: "Start transfer"}
      - {name: "MODE", bits: [2,1], description: "0=copy, 1=fill, 2=copy+transp"}
      - {name: "IRQ", bit: 3, description: "IRQ on done"}
      - {name: "RSV", bits: [7,4], reserved: true}
  - offset: 0x01
    name: "STATUS"
    fields:
      - {name: "DONE", bit: 0, description: "Done pending (W 1 = clear)"}
      - {name: "RSV", bits: [7,1], reserved: true}
  - offset: 0x02
    name: "SRC_0"
    fields: [{name: "ADDR", bits: [7,0], description: "Physical source [7:0]"}]
  - offset: 0x03
    name: "SRC_1"
    fields: [{name: "ADDR", bits: [7,0], description: "Physical source [15:8]"}]
  - offset: 0x04
    name: "SRC_2"
    fields: [{name: "ADDR", bits: [7,0], description: "Physical source [23:16]"}]
  - offset: 0x05
    name: "DST_0"
    fields: [{name: "ADDR", bits: [7,0], description: "Physical dest [7:0]"}]
  - offset: 0x06
    name: "DST_1"
    fields: [{name: "ADDR", bits: [7,0], description: "Physical dest [15:8]"}]
  - offset: 0x07
    name: "DST_2"
    fields: [{name: "ADDR", bits: [7,0], description: "Physical dest [23:16]"}]
  - offset: 0x08
    name: "WIDTH_0"
    fields: [{name: "W", bits: [7,0], description: "Bytes per line [7:0]"}]
  - offset: 0x09
    name: "WIDTH_1"
    fields: [{name: "W", bits: [7,0], description: "Bytes per line [15:8]"}]
  - offset: 0x0A
    name: "HEIGHT_0"
    fields: [{name: "H", bits: [7,0], description: "Lines [7:0]"}]
  - offset: 0x0B
    name: "HEIGHT_1"
    fields: [{name: "H", bits: [7,0], description: "Lines [15:8]"}]
  - offset: 0x0C
    name: "SSTRIDE_0"
    fields: [{name: "STR", bits: [7,0], description: "Source stride (signed) [7:0]"}]
  - offset: 0x0D
    name: "SSTRIDE_1"
    fields: [{name: "STR", bits: [7,0], description: "Source stride (signed) [15:8]"}]
  - offset: 0x0E
    name: "DSTRIDE_0"
    fields: [{name: "STR", bits: [7,0], description: "Dest stride (signed) [7:0]"}]
  - offset: 0x0F
    name: "DSTRIDE_1"
    fields: [{name: "STR", bits: [7,0], description: "Dest stride (signed) [15:8]"}]
  - offset: 0x10
    name: "KEY"
    fields: [{name: "KEY", bits: [7,0], description: "Fill byte / transparent color"}]
---
kind: enum
name: dma_blitter_modes
title: "Blitter Modes (CTRL[2:1])"
width: 2
entries:
  - {value: 0, name: "Copy",                  description: "Read from SRC, write to DST"}
  - {value: 1, name: "Fill",                  description: "Write KEY to DST"}
  - {value: 2, name: "Copy with transparent", description: "Read from SRC; if byte == KEY, skip the write"}