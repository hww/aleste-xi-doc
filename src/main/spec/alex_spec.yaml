kind: enum
name: alex_dma_channels
title: "SysDMA channel allocation"
width: 3
radix: dec
columns:
  - {key: value, title: "Channel"}
  - name
  - {key: description, title: "Use"}
entries:
  - {value: 0, name: CPU0, description: "Memory to memory, programmed by the CPU"}
  - {value: 1, name: CPU1, description: "Memory to memory, programmed by the CPU"}
  - {value: 2, name: CPU2, description: "Memory to memory, programmed by the CPU"}
  - {value: 3, name: CPU3, description: "Memory to memory, programmed by the CPU"}
  - {value: 4, name: SPI0, description: "Slot 0: SRC_ADDR feeds the TX FIFO, the RX FIFO drains to DST_ADDR"}
  - {value: 5, name: SPI1, description: "Slot 1: same scheme"}
  - {value: 6, name: SPI2, description: "Slot 2: same scheme"}
  - {value: 7, name: SPI3, description: "Slot 3: same scheme"}
notes:
  - "An SPI channel uses the same SRC_ADDR and DST_ADDR registers as a CPU channel; the peripheral side is hard-wired."
  - "For SPI channels COUNT is ignored: the job length comes from SPI_LEN."
  - "One channel carries both directions: in DUPLEX mode it raises a TX request and an RX request, and each grant moves one burst in one direction."
  - "SRC_CTRL / DST_CTRL codes of the existing SysDMA are not decoded in the register map yet (see open items)."
