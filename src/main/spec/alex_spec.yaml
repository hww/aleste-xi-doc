kind: bitfield
name: dma_prio
title: "PRIO[ch] · 8 bits"
width: 8
fields:
  - {name: MASK, bits: [2,0], access: rw, reset: 0, description: "Priority mask; a larger mask wins, ties go to the lower channel number"}
  - {name: RSV,  bits: [7,3], reserved: true}
