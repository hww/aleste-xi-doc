kind: enum
name: open_items
title: "Open items"
width: 4
columns:
  - {key: value, title: "#"}
  - name
  - {key: description, title: "To be decided"}
entries:
  - {value: 1, name: "Connector", description: "Verify PCIe position assignments, current per contact and insertion cycle rating against the datasheet"}
  - {value: 2, name: "Power",     description: "Real +/-12 V and +3.3 V currents per slot and the +5 V budget"}
  - {value: 3, name: "Audio",     description: "TDM frame format, bit depth, channels per slot; I2S as baseline profile; whether MCLK is needed"}
  - {value: 4, name: "SysDMA",    description: "Decode SRC_CTRL / DST_CTRL, Demand-mode handshake per burst, internal FIFO port width, DONE/ERROR semantics for SPI channels"}
  - {value: 5, name: "Arbitration", description: "Priority of SysDMA against the audio engine and the GPU on the shared memory path"}
  - {value: 6, name: "Blitter",   description: "Removal of the blitter and compatibility with the MiSTer port"}
  - {value: 7, name: "I2C",       description: "Four-pair multiplexer in the FPGA or an external one; EEPROM addresses"}
  - {value: 8, name: "ESD",       description: "TVS arrays, 22-33 ohm series resistors, contact mating sequence"}
