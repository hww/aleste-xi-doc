kind: regmap
name: alex_dma_ext
title: "SysDMA extension registers (ASSUMPTION: offset 0x50 is free)"
width: 8
view: [table]
registers:
  - {offset: 0x50, name: "PRIO[ch]", access: rw, description: "Per-channel arbitration mask, one register per channel", ref: dma_prio}
---
kind: enum
name: dma_arb
title: "SysDMA arbitration rules"
width: 4
columns:
  - {key: value, title: "Rule"}
  - name
  - {key: description, title: "Description"}
entries:
  - {value: 1, name: Key,         description: "Each requesting channel presents the key {MASK[2:0], ~CH[2:0]}; the larger key wins"}
  - {value: 2, name: Elimination, description: "Equivalent to NuBus bitwise elimination: the key is compared from the MSB down and losers drop out; implemented as a 8-to-1 maximum tree"}
  - {value: 3, name: Granularity, description: "One grant moves up to BURST_BYTES bytes, then the arbiter runs again"}
  - {value: 4, name: Default,     description: "All MASK = 0: the lower channel number wins, so CPU channels outrank SPI channels"}
  - {value: 5, name: Override,    description: "A driver can raise MASK of an SPI channel while it talks to a latency-sensitive module"}
notes:
  - "Masks are not merged with a bitwise OR: OR would produce a value no channel owns. The arbiter selects the winning key."
  - "Arbitration against the audio engine and the GPU on the shared memory path is outside this table (see open items)."
---
kind: enum
name: spi_load
title: "SysDMA bus load of one duplex SPI slot"
width: 4
columns:
  - {key: value, title: "SCK"}
  - {key: name, title: "One slot, duplex"}
  - {key: description, title: "Four slots, duplex"}
entries:
  - {value: "12 MHz", name: "3.0 MB/s",  description: "12 MB/s, does not fit"}
  - {value: "4 MHz",  name: "1.0 MB/s",  description: "4 MB/s, does not fit the sustained estimate"}
  - {value: "2 MHz",  name: "0.5 MB/s",  description: "2 MB/s, fits the sustained estimate"}
  - {value: "1 MHz",  name: "0.25 MB/s", description: "1 MB/s"}
notes:
  - "Load = 2 memory accesses per byte (read TX buffer, write RX buffer) = SCK_MHz / 4 MB/s per duplex slot; half that in TX_ONLY or RX_ONLY."
  - "The SPI side does not use the 8-bit bus: FIFOs connect to SysDMA through an internal port."
  - "If DMA cannot keep up, SCK stops at a byte boundary (STALL) instead of losing data."
