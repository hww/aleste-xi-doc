    fields: [{name: "MFG", msb: 7, lsb: 0, description: "Manufacturer Saisho"}]
  - addr: "0,1,1"
    name: "Solavox"
    fields: [{name: "MFG", msb: 7, lsb: 0, description: "Manufacturer Solavox"}]
  - addr: "1,0,0"
    name: "Awa"
    fields: [{name: "MFG", msb: 7, lsb: 0, description: "Manufacturer Awa"}]
  - addr: "1,0,1"
    name: "Schneider"
    fields: [{name: "MFG", msb: 7, lsb: 0, description: "Manufacturer Schneider"}]
  - addr: "1,1,0"
    name: "Orion"
    fields: [{name: "MFG", msb: 7, lsb: 0, description: "Manufacturer Orion"}]
  - addr: "1,1,1"
    name: "Amstrad"
