name: MODE REGISTER
width: 24
fields:
  - {name: DFMT, msb: 0, lsb: 0, description: "Формат приёмника (0=4bpp, 1=8bpp)"}
  - {name: SFMT, msb: 2, lsb: 1, description: "Формат источника (0=4bpp, 1=8bpp, 2=1bpp)"}
  - {name: COP, msb: 5, lsb: 3, description: "Операция комбайнера"}
  - {name: TR, msb: 6, lsb: 6, description: "Прозрачность (1=вкл)"}
  - {name: RESERVED, msb: 23, lsb: 7, description: "Зарезервировано"}