name: FIFO command opcodes
dispatch:
  - {range: "0x00-0x1F", name: "SET16", description: "Write FIFO16S into R0-R31"}
  - {range: "0x20-0x3F", name: "SET8",  description: "Write FIFO8 into R0-R31"}
commands:
  - {opcode: "0x40", name: "NOP",     description: "No operation"}
  - {opcode: "0x41", name: "FILL",    description: "Fill rectangle"}
  - {opcode: "0x42", name: "COPY",    description: "Copy pixels"}
  - {opcode: "0x43", name: "STENCIL", description: "Stencil operation"}
  - {opcode: "0x44", name: "LINE",    description: "Draw line"}
  - {opcode: "0x45", name: "AFFINE",  description: "Affine transform"}
  - {opcode: "0x46", name: "PAL",     description: "Write palette entry"}
  - {opcode: "0x47", name: "LOAD",    description: "Load bytes into video memory"}
  - {opcode: "0x48", name: "IRQ",     description: "Request interrupt after prior work"}
  - {opcode: "0x49", name: "GET",     description: "Copy register to host-readable latch"}
notes:
  - "SET16/SET8 opcodes encode the destination register in the low five bits."
  - "Per-command payload layouts and lengths must be specified before RTL implementation."