kind: table
name: commands
title: "Входной протокол: команды от Z80"
notes:
  - "SET и EXECUTE — команды входного протокола. Их обрабатывает микрокоманда NEXT."
  - "FILL, COPY, LINE, AFFINE — это ID микропрограмм. Команда EXECUTE ID запускает микропрограмму с этим ID."
  - "Входной протокол не превращается в 36-битные микрокоманды. FSM собирает полную команду (SET — 3 байта, EXECUTE — 2 байта) и выдаёт её NEXT."
  - "Пока выполняется микропрограмма (FILL, COPY, ...), FSM продолжает принимать байты в FIFO, но NEXT не исполняет их до возврата в MAIN."
columns:
  - {key: opcode, label: "Опкод"}
  - {key: name, label: "Имя", bold: true}
  - {key: length, label: "Длина (байт)"}
  - {key: payload, label: "Payload"}
  - {key: description, label: "Описание"}
rows:
  - {opcode: "0x00–0x1F", name: "SET Rn",   length: 3, payload: "16-бит значение", description: "Записать значение в регистр Rn"}
  - {opcode: "0x40",      name: "EXECUTE",  length: 2, payload: "8-бит ID микропрограммы", description: "Запустить микропрограмму"}