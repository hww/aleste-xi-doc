canvas: {width: 1120, height: 620}
blocks:
  # Верхний ряд
  - {id: z80,   x: 32,  y: 90,  w: 508, h: 100, title: "Z80", subtitle: "Host CPU", color: "#24476B", icon: "cpu"}
  - {id: fifo,  x: 548, y: 90,  w: 508, h: 100, title: "FIFO", subtitle: "Command stream", color: "#65508B", icon: "layers"}
  
  # Контейнер микроядра
  - {id: engine_bg, x: 32, y: 200, w: 1024, h: 270, color: "#263B4B"}
  - {id: engine_title, x: 32, y: 235, title: "MICROCODE ENGINE", align: "center"}

  # Внутренности микроядра
  - {id: seq,   x: 48,  y: 260, w: 488, h: 70, title: "Sequencer", subtitle: "PC / CALL / JMP", color: "#355A78"}
  - {id: rom,   x: 548, y: 260, w: 488, h: 70, title: "Control ROM", subtitle: "512 × 36", color: "#355A78"}
  - {id: regs,  x: 48,  y: 340, w: 988, h: 70, title: "Register File · R0–R31", subtitle: "24-bit · 2 read ports", color: "#286A5A"}
  - {id: alu,   x: 48,  y: 420, w: 988, h: 40, title: "ALU · 24-bit", subtitle: "MUL · COMB · FLAGS", color: "#286A5A"}

  # Нижняя часть
  - {id: mem,   x: 32,  y: 480, w: 1024, h: 70, title: "Pixel Memory Engine", subtitle: "SW / DW · SIDX / DIDX · FLUSH", color: "#76532E"}
  - {id: bus,   x: 32,  y: 560, w: 1024, h: 40, title: "Wishbone 16-bit → Video RAM", color: "#24476B"}

connectors:
  - {from: z80,  to: fifo}
  - {from: fifo, to: seq,  type: vertical}
  - {from: seq,  to: regs, type: vertical}
  - {from: rom,  to: regs, type: vertical}
  - {from: regs, to: alu,  type: vertical}
  - {from: engine_bg, to: mem, type: vertical}
  - {from: mem,  to: bus,  type: vertical}

footer: "Иллюстрация визуального языка, а не окончательная схема соединений."