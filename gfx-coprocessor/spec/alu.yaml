name: ALU operations
width: 24
operations:
  - {code: 0,  name: MOV,  description: "A"}
  - {code: 1,  name: ADD,  description: "24-bit addition; updates Z and N"}
  - {code: 2,  name: SUB,  description: "24-bit subtraction; updates Z and N"}
  - {code: 3,  name: AND,  description: "Bitwise AND"}
  - {code: 4,  name: OR,   description: "Bitwise OR"}
  - {code: 5,  name: XOR,  description: "Bitwise XOR"}
  - {code: 6,  name: SHL,  description: "Shift left by B[4:0]"}
  - {code: 7,  name: SHR,  description: "Logical shift right by B[4:0]"}
  - {code: 8,  name: SAR,  description: "Arithmetic shift right by B[4:0]"}
  - {code: 9,  name: MIN,  description: "Signed minimum"}
  - {code: 10, name: MAX,  description: "Signed maximum"}
  - {code: 11, name: MUL,  description: "A[11:0] × B[11:0] → P"}
  - {code: 12, name: ADDS, description: "Saturating addition"}
  - {code: 13, name: SUBS, description: "Saturating subtraction"}
  - {code: 14, name: COMB, description: "Pixel combine controlled by MODE"}