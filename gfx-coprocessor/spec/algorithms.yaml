algorithms:
  fill:
    title: "FILL: Rectangle Fill"
    nodes:
      - {id: start,  type: start,    text: "START FILL"}
      - {id: init,   type: process,  text: "T2 = H\\nT5 = DY"}
      - {id: clip,   type: process,  text: "T3 = MAX(DX, CX0)\\nT4 = MIN(DX+W, CX1)"}
      - {id: check1, type: decision, text: "T4 = T4 - T3\\nT4 < 0 ?"}
      - {id: row,    type: process,  text: "T0 = T5 * DSTRIDE + T3\\nT1 = T4"}
      - {id: pix,    type: process,  text: "DIDX = T0\\nDPIX = COMB(FG, DPIX)\\nT0++, T1--"}
      - {id: check2, type: decision, text: "T1 != 0 ?"}
      - {id: next,   type: process,  text: "T5++\\nT2--"}
      - {id: check3, type: decision, text: "T2 != 0 ?"}
      - {id: done,   type: process,  text: "FLUSH\\nJMP MAIN"}
      - {id: end,    type: end,      text: "END FILL"}
    edges:
      - {from: start,  to: init}
      - {from: init,   to: clip}
      - {from: clip,   to: check1}
      - {from: check1, to: row,    label: "no"}
      - {from: check1, to: done,   label: "yes (W<=0)"}
      - {from: row,    to: pix}
      - {from: pix,    to: check2}
      - {from: check2, to: pix,    label: "yes"}
      - {from: check2, to: next,   label: "no"}
      - {from: next,   to: check3}
      - {from: check3, to: row,    label: "yes"}
      - {from: check3, to: done,   label: "no"}
      - {from: done,   to: end}

  copy:
    title: "COPY: Transparent Copy"
    nodes:
      - {id: start,  type: start,    text: "START COPY"}
      - {id: pix,    type: process,  text: "SIDX = T6, DIDX = T0\\nDPIX = COMB(SPIX, DPIX)"}
      - {id: inc,    type: process,  text: "T6++, T0++, T1--"}
      - {id: check,  type: decision, text: "T1 != 0 ?"}
      - {id: done,   type: process,  text: "FLUSH, JMP MAIN"}
      - {id: end,    type: end,      text: "END COPY"}
    edges:
      - {from: start, to: pix}
      - {from: pix,   to: inc}
      - {from: inc,   to: check}
      - {from: check, to: pix,   label: "yes"}
      - {from: check, to: done,  label: "no"}
      - {from: done,  to: end}