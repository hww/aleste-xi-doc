name: GFX coprocessor register file
width: 24
count: 32
read_ports: 2
write_ports: 1
registers:
  - {index: 0,  name: DX,      group: destination, description: "Destination X coordinate"}
  - {index: 1,  name: DY,      group: destination, description: "Destination Y coordinate"}
  - {index: 2,  name: W,       group: destination, description: "Rectangle width"}
  - {index: 3,  name: H,       group: destination, description: "Rectangle height"}
  - {index: 4,  name: SX,      group: source,      description: "Source X coordinate"}
  - {index: 5,  name: SY,      group: source,      description: "Source Y coordinate"}
  - {index: 6,  name: DSTRIDE, group: memory,      description: "Destination row stride"}
  - {index: 7,  name: SSTRIDE, group: memory,      description: "Source row stride"}
  - {index: 8,  name: DBASE,   group: memory,      description: "Destination base address"}
  - {index: 9,  name: SBASE,   group: memory,      description: "Source base address"}
  - {index: 10, name: FG,      group: pixel,       description: "Foreground colour"}
  - {index: 11, name: BG,      group: pixel,       description: "Background colour"}
  - {index: 12, name: MODE,    group: pixel,       description: "Pixel formats and combine operation"}
  - {index: 13, name: CX0,     group: clipping,    description: "Clip window left"}
  - {index: 14, name: CY0,     group: clipping,    description: "Clip window top"}
  - {index: 15, name: CX1,     group: clipping,    description: "Clip window right"}
  - {index: 16, name: CY1,     group: clipping,    description: "Clip window bottom"}
  - {index: 17, name: STA,     group: affine,      description: "Affine horizontal U increment"}
  - {index: 18, name: STB,     group: affine,      description: "Affine horizontal V increment"}
  - {index: 19, name: STC,     group: affine,      description: "Affine vertical U increment"}
  - {index: 20, name: STD,     group: affine,      description: "Affine vertical V increment"}
  - {index: 21, name: T0,      group: temporary,   description: "Temporary 0; commonly destination linear index"}
  - {index: 22, name: T1,      group: temporary,   description: "Temporary 1; commonly inner-loop counter"}
  - {index: 23, name: T2,      group: temporary,   description: "Temporary 2; commonly outer-loop counter"}
  - {index: 24, name: T3,      group: temporary,   description: "Temporary 3; commonly clipped X start"}
  - {index: 25, name: T4,      group: temporary,   description: "Temporary 4; commonly clipped width or X end"}
  - {index: 26, name: T5,      group: temporary,   description: "Temporary 5; commonly current Y"}
  - {index: 27, name: T6,      group: temporary,   description: "Temporary 6; commonly source linear index"}
  - {index: 28, name: T7,      group: temporary,   description: "General temporary register"}
  - {index: 29, name: T8,      group: temporary,   description: "General temporary register"}
  - {index: 30, name: T9,      group: temporary,   description: "General temporary register"}
  - {index: 31, name: T10,     group: temporary,   description: "General temporary register"}